<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Accès privé — Dyonysos</title><style>:root{--n:#08233f;--b:#1688d8;--t:#26384a;--m:#667789;--l:#d7e5ee;--s:#f3f8fb;--g:#198765}*{box-sizing:border-box}body{margin:0;font:16px/1.55 Arial,sans-serif;color:var(--t);background:var(--s)}.wrap{max-width:1100px;margin:auto;padding:0 24px}header{background:#fff;border-bottom:1px solid var(--l)}nav{height:78px;display:flex;align-items:center}nav img{width:165px}nav a:last-child{margin-left:auto;color:var(--t);text-decoration:none;font-weight:700}.hero{background:linear-gradient(115deg,#071f39,#0c466c);color:#fff;padding:55px 0}.hero h1{font-size:44px;margin:0 0 8px}.hero p{color:#cbddeb}.login{max-width:470px;margin:55px auto;background:#fff;border:1px solid var(--l);border-radius:12px;padding:30px;box-shadow:0 25px 70px #0b315110}.field{margin-bottom:17px}label{display:block;font-weight:800;font-size:14px;margin-bottom:7px}input{width:100%;padding:13px;border:1px solid #b9cad7;border-radius:6px;font:inherit}button{border:0;background:var(--b);color:#fff;padding:13px 20px;border-radius:6px;font-weight:800;cursor:pointer}.error{color:#b32631;font-weight:700}.dashboard{padding:50px 24px}.dashhead{display:flex;justify-content:space-between;align-items:center}.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:28px}.group{background:#fff;border:1px solid var(--l);border-radius:10px;padding:24px}.group h2{color:var(--n);font-size:20px;margin-top:0}.link{padding:13px 0;border-top:1px solid var(--l)}.link a{color:var(--b);font-weight:800;text-decoration:none}.status{display:block;color:var(--m);font-size:13px;margin-top:3px}.sensitive{color:#9b5b00;font-size:11px;font-weight:900;text-transform:uppercase;margin-left:7px}.hidden{display:none}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:28px;border-bottom:1px solid var(--l)}.tab{padding:11px 18px;border:0;background:none;color:var(--t);font-weight:800;cursor:pointer;border-bottom:3px solid transparent;font-size:15px;border-radius:6px 6px 0 0}.tab:hover{color:var(--n);background:#e9f2f9}.tab.active{color:var(--n);background:#fff;border-bottom-color:var(--b);box-shadow:0 -1px 0 var(--l) inset,1px 0 0 var(--l) inset,-1px 0 0 var(--l) inset}.panel{display:none;padding-top:26px}.panel.active{display:block}.note{background:#fff8e8;border:1px solid #f0dca0;border-radius:8px;padding:14px 16px;font-size:14px;color:#6b5300;margin-bottom:18px}.kpi-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}.kpi-card{background:#fff;border:1px solid var(--l);border-radius:10px;padding:16px}.kpi-card b{display:block;font-size:26px;color:var(--n)}.kpi-card span{font-size:13px;color:var(--m)}table.data{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--l);border-radius:10px;overflow:hidden;font-size:14px}table.data th,table.data td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--l)}table.data th{background:var(--s);color:var(--n)}table.data td.num{text-align:right;font-variant-numeric:tabular-nums}.muted{color:var(--m)}.cat-block{margin-bottom:22px}.cat-block h3{color:var(--n);margin-bottom:8px}.prio{display:inline-block;font-size:11px;font-weight:900;text-transform:uppercase;padding:2px 8px;border-radius:20px;margin-left:6px}.prio-urgent{background:#fbe1e1;color:#a11d1d}.prio-normal{background:#e4f0e9;color:#1b6b45}.prio-autre{background:#eef1f4;color:var(--m)}details.proj{background:#fff;border:1px solid var(--l);border-radius:10px;margin-bottom:10px;padding:0}details.proj summary{cursor:pointer;padding:14px 16px;font-weight:800;color:var(--n);list-style:none;display:flex;align-items:center;gap:8px}details.proj summary::-webkit-details-marker{display:none}details.proj summary::before{content:'+';display:inline-block;width:18px;color:var(--b);font-weight:900}details.proj[open] summary::before{content:'–'}details.proj .body{padding:0 16px 16px;border-top:1px solid var(--l)}details.proj .body dl{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:14px;margin:12px 0}details.proj .body dt{color:var(--m)}details.proj .body ul{margin:6px 0 0;padding-left:18px}.suivi-wrap{margin-top:14px;padding-top:14px;border-top:1px dashed var(--l)}.suivi-wrap h4{margin:14px 0 6px;color:var(--n);font-size:13px}.suivi-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:1px;background:var(--l);border:1px solid var(--l);border-radius:8px;overflow:hidden;margin-bottom:12px}.suivi-stats div{background:#fff;padding:8px 10px}.suivi-stats b{display:block;font-size:17px;color:var(--n)}.suivi-stats span{font-size:10.5px;color:var(--m);text-transform:uppercase;letter-spacing:.03em}.suivi-decision{background:#eaf6f1;border:1px solid #b7ddc9;border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:13px}.suivi-decision .tag{font-size:11px;font-weight:900;text-transform:uppercase;color:#1b6b45;display:block;margin-bottom:4px}.suivi-decision .qui{font-size:12px;color:var(--m);display:block;margin-top:6px}.suivi-flag{background:#fff8e8;border:1px solid #f0dca0;border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:13px}.suivi-flag .tag{font-size:11px;font-weight:900;text-transform:uppercase;color:#8a5a00;display:block;margin-bottom:4px}.pill{display:inline-block;font-size:10px;font-weight:900;text-transform:uppercase;padding:2px 7px;border-radius:20px;margin-right:6px}.pill-ok{background:#e3f3e7;color:#1e7a3d}.pill-warn{background:#fbeeda;color:#a9700d}.pill-crit{background:#f7e3df;color:#a7332b}.pill-muted{background:#eef1f4;color:var(--m)}.suivi-tasks{list-style:none;margin:0 0 4px;padding:0;font-size:12.5px}.suivi-tasks li{padding:5px 0;border-bottom:1px solid var(--l)}.suivi-tasks li:last-child{border-bottom:none}.suivi-idtag{font-family:monospace;font-size:10.5px;color:var(--m);margin-right:4px}.suivi-block{background:var(--s);border:1px solid var(--l);border-radius:8px;padding:12px 14px;margin-bottom:10px}.suivi-block h5{margin:0 0 4px}.suivi-block p{margin:0 0 8px;font-size:12px;color:var(--m)}.suivi-block ul{list-style:none;margin:0;padding:0;font-size:12.5px}.suivi-block li{padding:3px 0}.suivi-delivered{font-size:12.5px;margin-bottom:4px}.suivi-delivered .row{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--l)}.suivi-delivered .row:last-child{border-bottom:none}.suivi-delivered .time{color:var(--m);flex:0 0 48px}.suivi-access{font-size:13px;margin-bottom:4px}.suivi-access div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dotted var(--l)}.suivi-steps{margin:0;padding-left:18px;font-size:12.5px;color:var(--m)}@media(max-width:720px){.groups{grid-template-columns:1fr}.hero h1{font-size:36px}table.data{font-size:12.5px}details.proj .body dl{grid-template-columns:1fr}}</style><link rel="stylesheet" href="/common.css"><link rel="stylesheet" href="/theme.css"></head><body><header><nav class="wrap"><a href="/"><img src="/logo-dyonysos-wordmark.png" alt="Dyonysos"></a><a href="/">Retour au site public</a></nav></header><section class="hero"><div class="wrap"><h1>Espace privé Dyonysos</h1><p>Accès réservé à l’administration et aux projets internes.</p></div></section><main><form id="loginForm" class="login"><h2>Connexion</h2><div class="field"><label for="email">Identifiant</label><input id="email" name="email" type="email" required autocomplete="username"></div><div class="field"><label for="password">Mot de passe</label><input id="password" name="password" type="password" required autocomplete="current-password"></div><button type="submit">Se connecter</button><p id="loginStatus" role="status"></p></form><section id="dashboard" class="wrap dashboard hidden"><div class="dashhead"><div><h2>Pilotage Dyonysos</h2><p>Les liens et données sensibles ne sont pas affichés sur la vitrine publique.</p></div><button id="lo   tiktok:'<svg width="14" height="14" viewBox="0 0 24 24" fill="#000000" style="vertical-align:-2px"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>',

const loaded={};
const render=async()=>{const r=await fetch('/api/private-links',{credentials:'same-origin'});if(!r.ok){loginForm.classList.remove('hidden');dashboard.classList.add('hidden');return}const data=await r.json();loginForm.classList.add('hidden');dashboard.classList.remove('hidden');groups.innerHTML=data.groups.map(g=>`<section class="group"><h2>${g.title}</h2>${g.links.map(l=>`<div class="link">${l.url?`<a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.name} →</a>`:`<strong>${l.name}</strong>`}${l.sensitive?'<span class="sensitive">Confidentiel</span>':''}${l.status?`<span class="status">${l.status}</span>`:''}</div>`).join('')}</section>`).join('')};
loginForm.addEventListener('submit',async e=>{e.preventDefault();loginStatus.textContent='Connexion…';loginStatus.className='';const body=Object.fromEntries(new FormData(loginForm));const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok){loginStatus.textContent=data.error||'Connexion impossible.';loginStatus.className='error';return}loginForm.reset();await render()});
logout.addEventListener('click',async()=>{await fetch('/api/logout',{method:'POST'});location.reload()});

let socialData=null;
const CANAL_ICON={linkedin:'in',facebook:'fb',instagram:'ig',tiktok:'tt',youtube:'yt'};
// Remplacé les abréviations texte par les vrais logos le 24/08/2026 (cf. NETWORK_ICONS plus haut) —
// garde CANAL_ICON en repli textuel si un canal ne fait pas partie des 5 réseaux connus.
const canalBadge=canal=>NETWORK_ICONS[canal]?`${NETWORK_ICONS[canal]} ${esc(CANAL_ICON[canal]||canal)}`:esc(CANAL_ICON[canal]||canal||'—');
// Même logo pour la colonne "Apps" du moteur Make (labels type "Facebook"/"LinkedIn", pas les clés
// minuscules de NETWORK_ICONS) — repli sur le texte brut pour les apps non-réseau (Sheets, Drive…).
const appBadge=label=>{const k=String(label||'').toLowerCase();return NETWORK_ICONS[k]?`${NETWORK_ICONS[k]} ${esc(label)}`:esc(label);};
function renderCalendrier(){
  const sel=document.getElementById('social-filtre-projet');
  const filtre=sel?sel.value:'';
  const d=socialData;
  const items=(d.calendrier.prochaines||[]).filter(it=>!filtre||String(it.projetId)===filtre);
  const box=document.getElementById('social-calendrier-box');
  if(!d.calendrier.configured){box.innerHTML='<div class="note">Agenda non disponible — '+esc(d.calendrier.error||'Google Sheets non configuré')+'</div>';return}
  if(!items.length){box.innerHTML='<div class="note">Aucune publication programmée pour le moment dans CONTENT_QUEUE'+(filtre?' pour ce projet':'')+' — l\'agenda se remplit automatiquement dès que le moteur de contenu génère des publications prêtes (statut READY/PUBLISHING).</div>';return}
  box.innerHTML='<table class="data"><tr><th>Programmé pour</th><th>Projet</th><th>Canal</th><th>Statut</th><th>Aperçu</th></tr>'+
    items.map(it=>`<tr><td class="muted">${it.programmePour?esc(it.programmePour):'—'}</td><td>${esc(it.projet)}</td><td><span class="pill pill-warn">${canalBadge(it.canal)}</span></td><td class="muted">${esc(it.statut)}</td><td class="muted">${esc(it.apercu)}${it.apercu&&it.apercu.length>=90?'…':''}</td></tr>`).join('')+
    '</table>';
}
function scenarioStatusPill(s){
  if(s.invalide)return'<span class="pill pill-crit">invalide</span>';
  if(s.erreurs>0)return'<span class="pill pill-warn">actif, erreurs</span>';
  if(s.actif)return'<span class="pill pill-ok">actif</span>';
  return'<span class="pill pill-muted">inactif</span>';
}
function renderMoteurMakeLive(mm){
  let html='<div class="kpi-cards">'+
    `<div class="kpi-card"><b>${mm.total}</b><span>Scénarios</span></div>`+
    `<div class="kpi-card"><b>${mm.actifs}</b><span>Actifs</span></div>`+
    `<div class="kpi-card"><b>${mm.enErreur}</b><span>Avec erreurs</span></div>`+
    '</div>';
  if(mm.dossiers&&mm.dossiers.length){html+='<p class="muted" style="font-size:13px">Dossiers : '+mm.dossiers.map(f=>esc(f.nom)+' ('+f.total+')').join(' · ')+'</p>'}
  const parDossier={};
  mm.scenarios.forEach(s=>{const k=s.dossier||'(racine)';(parDossier[k]=parDossier[k]||[]).push(s)});
  html+=Object.entries(parDossier).map(([dossier,scenarios])=>
    (dossier!=='(racine)'?`<h4 style="margin:14px 0 6px;color:var(--n)">${esc(dossier)}</h4>`:'')+
    '<table class="data"><tr><th>Scénario</th><th>Apps</th><th>Statut</th><th>Planification</th><th>Exécutions</th><th>Opérations</th><th>Erreurs</th><th>Dernière modif</th><th></th></tr>'+

function prioBadge(p){
  if(!p)return'';

  return `<span class="prio ${cls}">${esc(p)}</span>`;
}
function renderSuivi(s){
  let h='<div class="suivi-wrap"><p class="muted" style="font-size:12px">📋 Suivi détaillé — instantané du '+esc(s.capturedAt)+'</p>';
  if(s.stats&&s.stats.length){h+='<div class="suivi-stats">'+s.stats.map(x=>`<div><b>${esc(x.v)}</b><span>${esc(x.l)}</span></div>`).join('')+'</div>'}
  if(s.decision){h+=`<div class="suivi-decision"><span class="tag">${esc(s.decision.tag)}</span>${esc(s.decision.texte)}<span class="qui">${esc(s.decision.qui)}</span></div>`}
  if(s.flags&&s.flags.length){h+=s.flags.map(f=>`<div class="suivi-flag"><span class="tag">${esc(f.tag)}</span>${esc(f.texte)}</div>`).join('')}
  if(s.enCours&&s.enCours.length){h+=`<h4>En cours (${s.enCours.length})</h4><ul class="suivi-tasks">`+s.enCours.map(t=>`<li><span class="pill pill-warn">${esc(t.owner)}</span><span class="suivi-idtag">${esc(t.id)}</span>${esc(t.titre)}</li>`).join('')+'</ul>'}
  if(s.bloque&&s.bloque.length){h+=`<h4>Bloqué</h4>`+s.bloque.map(b=>`<div class="suivi-block"><h5><span class="pill pill-${esc(b.niveau)}">${esc(b.qui)}</span></h5><p>${esc(b.pourquoi)}</p>`+(b.taches&&b.taches.length?'<ul>'+b.taches.map(t=>`<li><span class="suivi-idtag">${esc(t.id)}</span>${esc(t.titre)}</li>`).join('')+'</ul>':'')+'</div>').join('')}
  if(s.livreAujourdhui&&s.livreAujourdhui.length){h+=`<h4>Livré</h4><div class="suivi-delivered">`+s.livreAujourdhui.map(r=>`<div class="row"><span class="time">${esc(r.heure)}</span><span><strong>${esc(r.titre)}</strong> — ${esc(r.detail)} <span class="muted">(${esc(r.commit)})</span></span></div>`).join('')+'</div>'}
  if(s.acces&&s.acces.length){h+=`<h4>Accès</h4><div class="suivi-access">`+s.acces.map(a=>`<div><span>${esc(a.k)}</span><span>${a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.v)}</a>`:esc(a.v)}</span></div>`).join('')+'</div>'}
  if(s.commentLancer&&s.commentLancer.length){h+=`<h4>Comment lancer</h4><ol class="suivi-steps">`+s.commentLancer.map(x=>`<li>${esc(x)}</li>`).join('')+'</ol>'}
  if(s.source){h+=`<p class="muted" style="font-size:11px;margin-top:10px">${esc(s.source)}</p>`}
  h+='</div>';
  return h;
}
function renderSuiviGranulaire(g){
  const statutClass=s=>({'Fait':'pill-ok','Implémenté':'pill-ok','Implémenté (simulé)':'pill-ok','Valide':'pill-ok','En cours':'pill-warn','À faire':'pill-warn','A faire':'pill-warn','Demandé':'pill-warn','Restant':'pill-warn','Backlog':'pill-muted','Idée':'pill-muted','Abandonne':'pill-crit'}[s]||'pill-muted');
  let h='<div class="suivi-wrap"><p class="muted" style="font-size:12px">📋 Backlog réel importé de Pilotage-des-projets.xlsx ('+g.total+' lignes'+(g.sourceNoms.length>1?' — '+g.sourceNoms.map(esc).join(' + '):'')+')</p>';
  h+='<div class="suivi-stats">'+Object.entries(g.statuts).map(([k,v])=>`<div><b>${v}</b><span>${esc(k)}</span></div>`).join('')+'</div>';
  h+='<ul class="suivi-tasks">'+g.lignes.map(l=>`<li><span class="pill ${statutClass(l.statut)}">${esc(l.statut)}</span>${l.priorite&&l.priorite!=='-'?`<span class="suivi-idtag">${esc(l.priorite)}</span>`:''}<strong>${esc(l.fonctionnalite)}</strong>${l.categorie?` <span class="muted">(${esc(l.categorie)})</span>`:''}${l.description?'<br><span class="muted" style="font-size:11.5px">'+esc(l.description)+'</span>':''}</li>`).join('')+'</ul>';
  h+='</div>';
  return h;
}
function projetCard(p,suiviMap){
  const dl=[
    ['URL', p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.url)}</a>`:'<span class="muted">—</span>'],
    ['GitHub', p.github?esc(p.github):'<span class="muted">—</span>'],
    ['Drive', p.drive?esc(p.drive):'<span class="muted">—</span>'],
    ['Local', p.local?esc(p.local):'<span class="muted">—</span>'],
    ['Dernier pilotage', p.dernierPilotage?esc(p.dernierPilotage):'<span class="muted">—</span>'],
  ];
  if(p.etat) dl.push(['État', esc(p.etat)]);
  let body='<dl>'+dl.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')+'</dl>';
  if(p.taches&&p.taches.length){body+='<div><strong>Tâches en cours / à réaliser</strong><ul>'+p.taches.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul></div>'}
  if(p.note){body+=`<p class="muted" style="margin-top:10px">↳ ${esc(p.note)}</p>`}
  if(p.suivi){body+=renderSuivi(p.suivi)}
  const gran=suiviMap&&suiviMap[p.name];
  if(gran){body+=renderSuiviGranulaire(gran)}
  if(!p.suivi&&!gran){body+='<p class="muted" style="margin-top:10px;font-size:12px">Pas encore de fiche "Suivi" détaillée pour ce projet — envoie-moi (ou fais générer par l’agent qui travaille dessus) un état du jour au même format que celui de Propecto et je l’intègre ici.</p>'}
  return `<details class="proj"><summary>${esc(p.name)}${prioBadge(p.priorite)}${gran?' <span class="pill pill-ok">'+gran.total+' tâches suivies</span>':''}</summary><div class="body">${body}</div></details>`;
}

// Tableau croisé dynamique KPI (objectifs vs réel) — ajouté le 24/08/2026 en réponse directe à
// "Kpi tu n'as pas ce qui est demandé tableau croisé dynamique". Sélection multi-projets, scénario,
// métrique et période, à la Odoo. Deux jeux 100% réels croisés côte à côte : les objectifs viennent
// de l'e-mail du 21/08/2026 (3 projets seulement — api/_lib/kpi-objectifs-data.js) et le réel du même
// instantané Vercel Web Analytics affiché plus haut dans l'onglet — jamais de valeur interpolée ou
// inventée entre les deux.

  const projets=tcd.projets||[];
  let html='<div class="cat-block"><h3>Tableau croisé dynamique — objectifs vs réel</h3>';

    '<div style="display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto;padding-right:8px">'+
    projets.map(p=>`<label style="font-size:13px"><input type="checkbox" class="tcd-projet-cb" value="${esc(p.nom)}" onchange="renderTcdTable()" ${p.aDesObjectifs?'checked':''} ${p.aDesObjectifs?'':'disabled'}> ${esc(p.nom)}${p.aDesObjectifs?'':' <span class="muted">(aucun objectif chiffré)</span>'}</label>`).join('')+
    '</div></div>';
  html+='<div><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Scénario</label>'+
    '<select id="tcd-scenario" onchange="renderTcdTable()">'+tcd.scenarios.map(s=>`<option value="${esc(s)}" ${s==='normal'?'selected':''}>${esc(s.charAt(0).toUpperCase()+s.slice(1))}</option>`).join('')+'</select></div>';
  html+='<div><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Métrique</label>'+
    '<select id="tcd-metrique" onchange="renderTcdTable()">'+tcd.metriques.map(m=>`<option value="${esc(m.cle)}">${esc(m.label)}</option>`).join('')+'</select></div>';
  html+='</div>';
  html+='<div id="tcd-table-box"></div>';
  html+='<div id="tcd-reel-box" style="margin-top:16px"></div>';
  html+='</div>';
  return html;
}

function renderTcdTable(){
  const tcd=window.__kpiTcd; if(!tcd) return;
  const scenarioEl=document.getElementById('tcd-scenario'), metriqueEl=document.getElementById('tcd-metrique');
  if(!scenarioEl||!metriqueEl) return;
  const scenario=scenarioEl.value, metrique=metriqueEl.value;
  const selected=Array.from(document.querySelectorAll('.tcd-projet-cb:checked')).map(cb=>cb.value);
  const objByNom={}; (tcd.objectifsParProjet||[]).forEach(o=>objByNom[o.projet]=o);
  const selectedAvecObjectifs=selected.filter(nom=>objByNom[nom]);
  const tableBox=document.getElementById('tcd-table-box'), reelBox=document.getElementById('tcd-reel-box');
  if(!selectedAvecObjectifs.length){
    tableBox.innerHTML='<p class="muted">Sélectionne au moins un projet avec objectifs (CVDesignPro, ArbitragePro+ ou Propecto).</p>';
    reelBox.innerHTML='';
    return;
  }
  const ref=objByNom[selectedAvecObjectifs[0]].scenarios[scenario];
  let html='<table class="data"><tr><th>Horizon</th>'+selectedAvecObjectifs.map(nom=>`<th>${esc(nom)}</th>`).join('')+(selectedAvecObjectifs.length>1?'<th>Total sélection</th>':'')+'</tr>';
  ref.forEach((pt,i)=>{
    let total=0;
    const cells=selectedAvecObjectifs.map(nom=>{
      const val=objByNom[nom].scenarios[scenario][i][metrique].cumul;
      total+=val;
      return `<td class="num">${fmtNum(val)}</td>`;
    });
    html+=`<tr><td>${esc(pt.horizon)} <span class="muted" style="font-size:11px">(${esc(pt.date)})</span></td>`+cells.join('')+(selectedAvecObjectifs.length>1?`<td class="num"><b>${fmtNum(total)}</b></td>`:'')+'</tr>';
  });
  html+='</table><p class="muted" style="font-size:12px;margin-top:4px">Valeurs cumulées depuis le 21/08/2026, scénario « '+esc(scenario)+' ».</p>';
  tableBox.innerHTML=html;

  const traficByNom={}; (tcd.traficParProjet||[]).forEach(t=>traficByNom[t.name]=t);
  const projetsInfo={}; (tcd.projets||[]).forEach(p=>projetsInfo[p.nom]=p);
  let reelHtml='<h4 style="margin:0 0 6px">Réel connu à ce jour (instantané Vercel Web Analytics — pas une série sur les mêmes horizons que les objectifs)</h4>'+
    '<table class="data"><tr><th>Projet</th><th>Période</th><th>Visiteurs</th><th>Pages vues</th></tr>';
  selected.forEach(nom=>{
    const info=projetsInfo[nom];
    const traf=info&&info.nomTraficReel?traficByNom[info.nomTraficReel]:null;
    if(!traf){reelHtml+=`<tr><td>${esc(nom)}</td><td colspan="3" class="muted">Aucune donnée de trafic réel connue pour ce projet.</td></tr>`;return;}
    Object.entries(traf.periodes).forEach(([per,val])=>{
      reelHtml+=`<tr><td>${esc(nom)}</td><td>${esc(per)}</td><td class="num">${val.visiteurs}</td><td class="num">${val.pageviews}</td></tr>`;
    });
  });
  reelHtml+='</table>';
  reelBox.innerHTML=reelHtml;
}

async function saveReseauxLinks(btn){
  const msg=document.getElementById('reseaux-save-msg');
  const inputs=[...document.querySelectorAll('#api-content input[data-pid]')];
  btn.disabled=true;msg.textContent='Enregistrement…';
  let okCount=0,errCount=0;
  try{
    for(const inp of inputs){
      const r=await fetch('/api/pilotage-social/reseaux-actions',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectId:inp.dataset.pid,field:inp.dataset.field,value:inp.value})});
      if(r.ok)okCount++;else errCount++;
    }
    msg.textContent=errCount?`${okCount} champ(s) enregistré(s), ${errCount} erreur(s).`:`${okCount} champ(s) enregistré(s).`;
  }catch(e){msg.textContent='Erreur réseau.'}

}

        if(!marches.length&&d.marcheParProjet){marches=Object.keys(d.marcheParProjet).filter(k=>k.startsWith(nom+' (')).map(k=>d.marcheParProjet[k])}
        html+=`<details class="proj"><summary>${esc(nom)}</summary><div class="body">`;
        marches.forEach(marche=>{
          if(marche.correctifImportant){html+='<div class="suivi-flag"><span class="tag">Correction factuelle</span>'+esc(marche.correctifImportant)+'</div>'}
          if(marche.marche){html+='<p class="muted" style="font-size:13px"><strong>Marché : </strong>'+esc(marche.marche)+'</p>'}
          if(marche.concurrents&&marche.concurrents.length){html+='<table class="data"><tr><th>Concurrent</th><th>Positionnement</th><th>Prix</th><th>Source</th></tr>'+
            marche.concurrents.map(c=>`<tr><td>${esc(c.nom)}</td><td class="muted">${esc(c.note)}</td><td class="num">${esc(c.prix)}</td><td><a href="${esc(c.source)}" target="_blank" rel="noopener noreferrer">source →</a></td></tr>`).join('')+'</table>'}
          if(marche.positionnement){html+='<p class="muted" style="font-size:13px;margin-top:8px">'+esc(marche.positionnement)+'</p>'}
        });
        const bmcLabels={segmentsClients:'Segments clients',propositionValeur:'Proposition de valeur',canaux:'Canaux',relationClient:'Relation client',revenus:'Revenus',ressourcesCles:'Ressources clés',activitesCles:'Activités clés',partenairesCles:'Partenaires clés',structureCouts:'Structure de coûts'};
        const renderBmc=b=>'<dl>'+Object.entries(bmcLabels).map(([k,label])=>b[k]?`<dt>${label}</dt><dd>${esc(b[k])}</dd>`:'').join('')+'</dl>';
        if(proj.bmc){html+='<h4 style="margin:14px 0 6px">Business Model Canvas</h4>'+renderBmc(proj.bmc)}
        if(proj.bmcTinderpp){html+='<h4 style="margin:14px 0 6px">Business Model Canvas — Tinder++</h4>'+renderBmc(proj.bmcTinderpp)}
        if(proj.bmcMympp){html+='<h4 style="margin:14px 0 6px">Business Model Canvas — Mym++</h4>'+renderBmc(proj.bmcMympp)}
        if(proj.swot){const s=proj.swot;html+='<h4 style="margin:14px 0 6px">SWOT</h4>';
          if(s.note){html+='<p class="muted" style="font-size:12.5px">'+esc(s.note)+'</p>'}
          html+='<div class="suivi-stats" style="grid-template-columns:repeat(2,1fr)">'+
            ['forces','faiblesses','opportunites','menaces'].map(k=>{const labels={forces:'Forces',faiblesses:'Faiblesses',opportunites:'Opportunités',menaces:'Menaces'};return s[k]&&s[k].length?`<div style="text-align:left"><span style="text-transform:uppercase;font-weight:900;font-size:11px;color:var(--n)">${labels[k]}</span><ul class="suivi-tasks">${s[k].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}).join('')+
            '</div>';
        }
        html+='</div></details>';
      });
      html+='</div>';
    }
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div class="note">Erreur de chargement.</div>'}
}

const loaders={api:loadApiAcces,social:loadSocial,projets:loadProjets,finance:loadFinance,kpi:loadKpi,crm:loadCrm,strategie:loadStrategie};
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  const tab=btn.dataset.tab;
  document.getElementById('panel-'+tab).classList.add('active');
  if(loaders[tab] && !loaded[tab]){loaded[tab]=true;loaders[tab]()}
}));

render();
</script><script src="/common.js" defer></script></body></html>
