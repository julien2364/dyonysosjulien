<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Accès privé — Dyonysos</title><style>:root{--n:#08233f;--b:#1688d8;--t:#26384a;--m:#667789;--l:#d7e5ee;--s:#f3f8fb;--g:#198765}*{box-sizing:border-box}body{margin:0;font:16px/1.55 Arial,sans-serif;color:var(--t);background:var(--s)}.wrap{max-width:1100px;margin:auto;padding:0 24px}header{background:#fff;border-bottom:1px solid var(--l)}nav{height:78px;display:flex;align-items:center}nav img{width:165px}nav a:last-child{margin-left:auto;color:var(--t);text-decoration:none;font-weight:700}.hero{background:linear-gradient(115deg,#071f39,#0c466c);color:#fff;padding:55px 0}.hero h1{font-size:44px;margin:0 0 8px}.hero p{color:#cbddeb}.login{max-width:470px;margin:55px auto;background:#fff;border:1px solid var(--l);border-radius:12px;padding:30px;box-shadow:0 25px 70px #0b315110}.field{margin-bottom:17px}label{display:block;font-weight:800;font-size:14px;margin-bottom:7px}input{width:100%;padding:13px;border:1px solid #b9cad7;border-radius:6px;font:inherit}button{border:0;background:var(--b);color:#fff;padding:13px 20px;border-radius:6px;font-weight:800;cursor:pointer}.error{color:#b32631;font-weight:700}.dashboard{padding:50px 24px}.dashhead{display:flex;justify-content:space-between;align-items:center}.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:28px}.group{background:#fff;border:1px solid var(--l);border-radius:10px;padding:24px}.group h2{color:var(--n);font-size:20px;margin-top:0}.link{padding:13px 0;border-top:1px solid var(--l)}.link a{color:var(--b);font-weight:800;text-decoration:none}.status{display:block;color:var(--m);font-size:13px;margin-top:3px}.sensitive{color:#9b5b00;font-size:11px;font-weight:900;text-transform:uppercase;margin-left:7px}.hidden{display:none}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:28px;border-bottom:1px solid var(--l)}.tab{padding:11px 18px;border:0;background:none;color:var(--t);font-weight:800;cursor:pointer;border-bottom:3px solid transparent;font-size:15px;border-radius:6px 6px 0 0}.tab:hover{color:var(--n);background:#e9f2f9}.tab.active{color:var(--n);background:#fff;border-bottom-color:var(--b);box-shadow:0 -1px 0 var(--l) inset,1px 0 0 var(--l) inset,-1px 0 0 var(--l) inset}.panel{display:none;padding-top:26px}.panel.active{display:block}.note{background:#fff8e8;border:1px solid #f0dca0;border-radius:8px;padding:14px 16px;font-size:14px;color:#6b5300;margin-bottom:18px}.kpi-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}.kpi-card{background:#fff;border:1px solid var(--l);border-radius:10px;padding:16px}.kpi-card b{display:block;font-size:26px;color:var(--n)}.kpi-card span{font-size:13px;color:var(--m)}table.data{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--l);border-radius:10px;overflow:hidden;font-size:14px}table.data th,table.data td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--l)}table.data th{background:var(--s);color:var(--n)}table.data td.num{text-align:right;font-variant-numeric:tabular-nums}.muted{color:var(--m)}.cat-block{margin-bottom:22px}.cat-block h3{color:var(--n);margin-bottom:8px}.prio{display:inline-block;font-size:11px;font-weight:900;text-transform:uppercase;padding:2px 8px;border-radius:20px;margin-left:6px}.prio-urgent{background:#fbe1e1;color:#a11d1d}.prio-normal{background:#e4f0e9;color:#1b6b45}.prio-autre{background:#eef1f4;color:var(--m)}details.proj{background:#fff;border:1px solid var(--l);border-radius:10px;margin-bottom:10px;padding:0}details.proj summary{cursor:pointer;padding:14px 16px;font-weight:800;color:var(--n);list-style:none;display:flex;align-items:center;gap:8px}details.proj summary::-webkit-details-marker{display:none}details.proj summary::before{content:'+';display:inline-block;width:18px;color:var(--b);font-weight:900}details.proj[open] summary::before{content:'–'}details.proj .body{padding:0 16px 16px;border-top:1px solid var(--l)}details.proj .body dl{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:14px;margin:12px 0}details.proj .body dt{color:var(--m)}details.proj .body ul{margin:6px 0 0;padding-left:18px}.suivi-wrap{margin-top:14px;padding-top:14px;border-top:1px dashed var(--l)}.suivi-wrap h4{margin:14px 0 6px;color:var(--n);font-size:13px}.suivi-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:1px;background:var(--l);border:1px solid var(--l);border-radius:8px;overflow:hidden;margin-bottom:12px}.suivi-stats div{background:#fff;padding:8px 10px}.suivi-stats b{display:block;font-size:17px;color:var(--n)}.suivi-stats span{font-size:10.5px;color:var(--m);text-transform:uppercase;letter-spacing:.03em}.suivi-decision{background:#eaf6f1;border:1px solid #b7ddc9;border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:13px}.suivi-decision .tag{font-size:11px;font-weight:900;text-transform:uppercase;color:#1b6b45;display:block;margin-bottom:4px}.suivi-decision .qui{font-size:12px;color:var(--m);display:block;margin-top:6px}.suivi-flag{background:#fff8e8;border:1px solid #f0dca0;border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:13px}.suivi-flag .tag{font-size:11px;font-weight:900;text-transform:uppercase;color:#8a5a00;display:block;margin-bottom:4px}.pill{display:inline-block;font-size:10px;font-weight:900;text-transform:uppercase;padding:2px 7px;border-radius:20px;margin-right:6px}.pill-ok{background:#e3f3e7;color:#1e7a3d}.pill-warn{background:#fbeeda;color:#a9700d}.pill-crit{background:#f7e3df;color:#a7332b}.pill-muted{background:#eef1f4;color:var(--m)}.suivi-tasks{list-style:none;margin:0 0 4px;padding:0;font-size:12.5px}.suivi-tasks li{padding:5px 0;border-bottom:1px solid var(--l)}.suivi-tasks li:last-child{border-bottom:none}.suivi-idtag{font-family:monospace;font-size:10.5px;color:var(--m);margin-right:4px}.suivi-block{background:var(--s);border:1px solid var(--l);border-radius:8px;padding:12px 14px;margin-bottom:10px}.suivi-block h5{margin:0 0 4px}.suivi-block p{margin:0 0 8px;font-size:12px;color:var(--m)}.suivi-block ul{list-style:none;margin:0;padding:0;font-size:12.5px}.suivi-block li{padding:3px 0}.suivi-delivered{font-size:12.5px;margin-bottom:4px}.suivi-delivered .row{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--l)}.suivi-delivered .row:last-child{border-bottom:none}.suivi-delivered .time{color:var(--m);flex:0 0 48px}.suivi-access{font-size:13px;margin-bottom:4px}.suivi-access div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dotted var(--l)}.suivi-steps{margin:0;padding-left:18px;font-size:12.5px;color:var(--m)}

.tcd-project{background:#fff;border:1px solid var(--l);border-radius:10px;padding:16px 18px;margin-bottom:14px}

  tiktok:'<svg width="14" height="14" viewBox="0 0 24 24" fill="#000000" style="vertical-align:-2px"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>',

const loaded={};
const render=async()=>{const r=await fetch('/api/private-links',{credentials:'same-origin'});if(!r.ok){loginForm.classList.remove('hidden');dashboard.classList.add('hidden');return}const data=await r.json();loginForm.classList.add('hidden');dashboard.classList.remove('hidden');groups.innerHTML=data.groups.map(g=>`<section class="group"><h2>${g.title}</h2>${g.links.map(l=>`<div class="link">${l.url?`<a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.name} →</a>`:`<strong>${l.name}</strong>`}${l.sensitive?'<span class="sensitive">Confidentiel</span>':''}${l.status?`<span class="status">${l.status}</span>`:''}</div>`).join('')}</section>`).join('')};
loginForm.addEventListener('submit',async e=>{e.preventDefault();loginStatus.textContent='Connexion…';loginStatus.className='';const body=Object.fromEntries(new FormData(loginForm));const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok){loginStatus.textContent=data.error||'Connexion impossible.';loginStatus.className='error';return}loginForm.reset();await render()});
logout.addEventListener('click',async()=>{await fetch('/api/logout',{method:'POST'});location.reload()});

let socialData=null;
const CANAL_ICON={linkedin:'in',facebook:'fb',instagram:'ig',tiktok:'tt',youtube:'yt'};
// Remplacé les abréviations texte par les vrais logos le 24/08/2026 (cf. NETWORK_ICONS plus haut) —
// garde CANAL_ICON en repli textuel si un canal ne fait pas partie des 5 réseaux connus.
const canalBadge=canal=>NETWORK_ICONS[canal]?`${NETWORK_ICONS[canal]} ${esc(CANAL_ICON[canal]||canal)}`:esc(CANAL_ICON[canal]||canal||'—');
// Même logo pour la colonne "Apps" du moteur Make (labels type "Facebook"/"LinkedIn", pas les clés
// minuscules de NETWORK_ICONS) — repli sur le texte brut pour les apps non-réseau (Sheets, Drive…).
const appBadge=label=>{const k=String(label||'').toLowerCase();return NETWORK_ICONS[k]?`${NETWORK_ICONS[k]} ${esc(label)}`:esc(label);};
function renderCalendrier(){
  const sel=document.getElementById('social-filtre-projet');
  const filtre=sel?sel.value:'';
  const d=socialData;
  const items=(d.calendrier.prochaines||[]).filter(it=>!filtre||String(it.projetId)===filtre);
  const box=document.getElementById('social-calendrier-box');
  if(!d.calendrier.configured){box.innerHTML='<div class="note">Agenda non disponible — '+esc(d.calendrier.error||'Google Sheets non configuré')+'</div>';return}
  if(!items.length){box.innerHTML='<div class="note">Aucune publication programmée pour le moment dans CONTENT_QUEUE'+(filtre?' pour ce projet':'')+' — l\'agenda se remplit automatiquement dès que le moteur de contenu génère des publications prêtes (statut READY/PUBLISHING).</div>';return}
  box.innerHTML='<table class="data"><tr><th>Programmé pour</th><th>Projet</th><th>Canal</th><th>Statut</th><th>Aperçu</th></tr>'+
    items.map(it=>`<tr><td class="muted">${it.programmePour?esc(it.programmePour):'—'}</td><td>${esc(it.projet)}</td><td><span class="pill pill-warn">${canalBadge(it.canal)}</span></td><td class="muted">${esc(it.statut)}</td><td class="muted">${esc(it.apercu)}${it.apercu&&it.apercu.length>=90?'…':''}</td></tr>`).join('')+
    '</table>';
}
function scenarioStatusPill(s){
  if(s.invalide)return'<span class="pill pill-crit">invalide</span>';
  if(s.erreurs>0)return'<span class="pill pill-warn">actif, erreurs</span>';
  if(s.actif)return'<span class="pill pill-ok">actif</span>';
  return'<span class="pill pill-muted">inactif</span>';
}
function renderMoteurMakeLive(mm){
  let html='<div class="kpi-cards">'+
    `<div class="kpi-card"><b>${mm.total}</b><span>Scénarios</span></div>`+
    `<div class="kpi-card"><b>${mm.actifs}</b><span>Actifs</span></div>`+
    `<div class="kpi-card"><b>${mm.enErreur}</b><span>Avec erreurs</span></div>`+
    '</div>';
  if(mm.dossiers&&mm.dossiers.length){html+='<p class="muted" style="font-size:13px">Dossiers : '+mm.dossiers.map(f=>esc(f.nom)+' ('+f.total+')').join(' · ')+'</p>'}
  const parDossier={};
  mm.scenarios.forEach(s=>{const k=s.dossier||'(racine)';(parDossier[k]=parDossier[k]||[]).push(s)});
  html+=Object.entries(parDossier).map(([dossier,scenarios])=>
    (dossier!=='(racine)'?`<h4 style="margin:14px 0 6px;color:var(--n)">${esc(dossier)}</h4>`:'')+
    '<table class="data"><tr><th>Scénario</th><th>Apps</th><th>Statut</th><th>Planification</th><th>Exécutions</th><th>Opérations</th><th>Erreurs</th><th>Dernière modif</th><th></th></tr>'+
    scenarios.map(s=>`<tr><td>${esc(s.nom)}</td><td class="muted" style="font-size:11.5px">${s.apps.map(appBadge).join(', ')}</td><td>${scenarioStatusPill(s)}</td><td class="muted">${esc(s.planification||'—')}</td><td class="num">${s.executions}</td><td class="num">${s.operations}</td><td class="num">${s.erreurs}</td><td class="muted">${s.derniereMaj?new Date(s.derniereMaj).toLocaleDateString('fr-FR'):'—'}</td><td><button style="font-size:11.5px;padding:6px 10px" onclick="makeToggleScenario(${s.id},${s.actif})">${s.actif?'Désactiver':'Activer'}</button></td></tr>`).join('')+
    '</table>'
  ).join('');
  html+='<div id="make-toggle-msg" class="muted" style="font-size:13px;margin-top:6px"></div>';
  return html;
}
async function makeToggleScenario(scenarioId,currentlyActive){
  const msg=document.getElementById('make-toggle-msg');
  if(msg)msg.textContent='Mise à jour…';
  try{
    const r=await fetch('/api/make-actions',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:currentlyActive?'deactivate':'activate',scenarioId})});
    const d=await r.json();
    if(!r.ok||!d.ok){if(msg)msg.textContent='Erreur : '+(d.error||('HTTP '+r.status));return}
    loaded.social=false;
    loadSocial();
  }catch(e){if(msg)msg.textContent='Erreur réseau.'}
}

function prioBadge(p){
  if(!p)return'';
  const cls=p.startsWith('urgent')?'prio-urgent':(p.startsWith('normal')?'prio-normal':'prio-autre');
  return `<span class="prio ${cls}">${esc(p)}</span>`;
}
function renderSuivi(s){
  let h='<div class="suivi-wrap"><p class="muted" style="font-size:12px">📋 Suivi détaillé — instantané du '+esc(s.capturedAt)+'</p>';
  if(s.stats&&s.stats.length){h+='<div class="suivi-stats">'+s.stats.map(x=>`<div><b>${esc(x.v)}</b><span>${esc(x.l)}</span></div>`).join('')+'</div>'}
  if(s.decision){h+=`<div class="suivi-decision"><span class="tag">${esc(s.decision.tag)}</span>${esc(s.decision.texte)}<span class="qui">${esc(s.decision.qui)}</span></div>`}
  if(s.flags&&s.flags.length){h+=s.flags.map(f=>`<div class="suivi-flag"><span class="tag">${esc(f.tag)}</span>${esc(f.texte)}</div>`).join('')}
  if(s.enCours&&s.enCours.length){h+=`<h4>En cours (${s.enCours.length})</h4><ul class="suivi-tasks">`+s.enCours.map(t=>`<li><span class="pill pill-warn">${esc(t.owner)}</span><span class="suivi-idtag">${esc(t.id)}</span>${esc(t.titre)}</li>`).join('')+'</ul>'}
  if(s.bloque&&s.bloque.length){h+=`<h4>Bloqué</h4>`+s.bloque.map(b=>`<div class="suivi-block"><h5><span class="pill pill-${esc(b.niveau)}">${esc(b.qui)}</span></h5><p>${esc(b.pourquoi)}</p>`+(b.taches&&b.taches.length?'<ul>'+b.taches.map(t=>`<li><span class="suivi-idtag">${esc(t.id)}</span>${esc(t.titre)}</li>`).join('')+'</ul>':'')+'</div>').join('')}
  if(s.livreAujourdhui&&s.livreAujourdhui.length){h+=`<h4>Livré</h4><div class="suivi-delivered">`+s.livreAujourdhui.map(r=>`<div class="row"><span class="time">${esc(r.heure)}</span><span><strong>${esc(r.titre)}</strong> — ${esc(r.detail)} <span class="muted">(${esc(r.commit)})</span></span></div>`).join('')+'</div>'}
  if(s.acces&&s.acces.length){h+=`<h4>Accès</h4><div class="suivi-access">`+s.acces.map(a=>`<div><span>${esc(a.k)}</span><span>${a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.v)}</a>`:esc(a.v)}</span></div>`).join('')+'</div>'}
  if(s.commentLancer&&s.commentLancer.length){h+=`<h4>Comment lancer</h4><ol class="suivi-steps">`+s.commentLancer.map(x=>`<li>${esc(x)}</li>`).join('')+'</ol>'}
  if(s.source){h+=`<p class="muted" style="font-size:11px;margin-top:10px">${esc(s.source)}</p>`}
  h+='</div>';
  return h;
}
function renderSuiviGranulaire(g){
  const statutClass=s=>({'Fait':'pill-ok','Implémenté':'pill-ok','Implémenté (simulé)':'pill-ok','Valide':'pill-ok','En cours':'pill-warn','À faire':'pill-warn','A faire':'pill-warn','Demandé':'pill-warn','Restant':'pill-warn','Backlog':'pill-muted','Idée':'pill-muted','Abandonne':'pill-crit'}[s]||'pill-muted');
  let h='<div class="suivi-wrap"><p class="muted" style="font-size:12px">📋 Backlog réel importé de Pilotage-des-projets.xlsx ('+g.total+' lignes'+(g.sourceNoms.length>1?' — '+g.sourceNoms.map(esc).join(' + '):'')+')</p>';
  h+='<div class="suivi-stats">'+Object.entries(g.statuts).map(([k,v])=>`<div><b>${v}</b><span>${esc(k)}</span></div>`).join('')+'</div>';
  h+='<ul class="suivi-tasks">'+g.lignes.map(l=>`<li><span class="pill ${statutClass(l.statut)}">${esc(l.statut)}</span>${l.priorite&&l.priorite!=='-'?`<span class="suivi-idtag">${esc(l.priorite)}</span>`:''}<strong>${esc(l.fonctionnalite)}</strong>${l.categorie?` <span class="muted">(${esc(l.categorie)})</span>`:''}${l.description?'<br><span class="muted" style="font-size:11.5px">'+esc(l.description)+'</span>':''}</li>`).join('')+'</ul>';
  h+='</div>';
  return h;
}
// Avancement live Taiga — ajouté le 24/08/2026 en réponse directe à "je veux que tu recalcules
// tout suivant l'avancé des projets [...] tout peut être consigné dans Odoo, Taiga [...] et tu fais
// afficher les datas". Remplace, quand une correspondance Taiga réelle existe, le texte statique
// taches[]/etat du registre par les vraies user stories Taiga (fait/en cours/bloqué + raison du
// blocage), rafraîchies à chaque chargement de la page — jamais une valeur figée dans un fichier.
function renderTaigaAvancement(m){
  let h='<div class="suivi-wrap"><p class="muted" style="font-size:12px">🔗 Avancement en direct — <a href="'+esc(m.taigaUrl)+'" target="_blank" rel="noopener noreferrer">'+esc(m.taigaNom)+' sur Taiga</a></p>';
  h+='<div class="suivi-stats"><div><b>'+m.fait+'</b><span>Fait</span></div><div><b>'+m.enCours+'</b><span>En cours</span></div><div><b>'+m.bloque.length+'</b><span>Bloqué</span></div></div>';
  if(m.bloque&&m.bloque.length){h+='<h4>Bloqué</h4><ul class="suivi-tasks">'+m.bloque.map(b=>`<li><span class="pill pill-crit">#${esc(b.id)}</span>${esc(b.titre)}${b.note?'<br><span class="muted" style="font-size:11.5px">'+esc(b.note)+'</span>':''}</li>`).join('')+'</ul>'}

function projetCard(p,suiviMap,avancement){
  const dl=[
    ['URL', p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.url)}</a>`:'<span class="muted">—</span>'],
    ['GitHub', p.github?esc(p.github):'<span class="muted">—</span>'],
    ['Drive', p.drive?esc(p.drive):'<span class="muted">—</span>'],
    ['Local', p.local?esc(p.local):'<span class="muted">—</span>'],
    ['Dernier pilotage', p.dernierPilotage?esc(p.dernierPilotage):'<span class="muted">—</span>'],
  ];
  if(p.etat) dl.push(['État', esc(p.etat)]);
  let body='<dl>'+dl.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')+'</dl>';
  if(p.taches&&p.taches.length){body+='<div><strong>Tâches en cours / à réaliser (statiques — voir avancement live ci-dessous si disponible)</strong><ul>'+p.taches.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul></div>'}
  if(p.note){body+=`<p class="muted" style="margin-top:10px">↳ ${esc(p.note)}</p>`}
  const taigaMatch=avancement&&avancement.configured&&avancement.parProjetRegistre?avancement.parProjetRegistre[p.name]:null;
  if(taigaMatch){body+=renderTaigaAvancement(taigaMatch)}
  if(p.suivi){body+=renderSuivi(p.suivi)}
  const gran=suiviMap&&suiviMap[p.name];
  if(gran){body+=renderSuiviGranulaire(gran)}
  if(!taigaMatch&&!p.suivi&&!gran){body+='<p class="muted" style="margin-top:10px;font-size:12px">Pas encore de fiche "Suivi" détaillée pour ce projet — envoie-moi (ou fais générer par l’agent qui travaille dessus) un état du jour au même format que celui de Propecto et je l’intègre ici, ou inscris ses tâches dans Taiga (projet du même nom) pour un suivi qui se met à jour tout seul.</p>'}
  const badge=taigaMatch?(taigaMatch.bloque.length?'<span class="status-pill crit">'+taigaMatch.bloque.length+' bloqué(s)</span>':(taigaMatch.enCours>0?'<span class="status-pill warn">'+taigaMatch.enCours+' en cours</span>':'<span class="status-pill good">à jour</span>')):(gran?' <span class="pill pill-ok">'+gran.total+' tâches suivies</span>':'');
  return `<details class="proj"><summary>${esc(p.name)}${prioBadge(p.priorite)} ${badge}</summary><div class="body">${body}</div></details>`;
}
async function loadProjets(){
  const el=document.getElementById('projets-content');
  try{
    const r=await fetch('/api/registre-projets',{credentials:'same-origin'});
    const d=await r.json();
    const suiviMap={};
    if(d.suiviGranulaire&&d.suiviGranulaire.parProjet){d.suiviGranulaire.parProjet.forEach(g=>{suiviMap[g.registryName]=g})}
    let html=`<p class="muted">${d.total} projets recensés — dernière vérification ${esc(d.updatedAt)}. Clique sur un projet pour dérouler ses infos, son état et ses tâches.</p>`;
    if(d.urgents&&d.urgents.length){html+='<div class="note"><strong>Priorités du moment : </strong>'+d.urgents.map(u=>esc(u.name)).join(', ')+'</div>'}
    if(d.suiviGranulaire){html+=`<div class="note">${esc(d.suiviGranulaire.note)}</div>`}
    if(d.avancement)html=renderAvancementBlock(d.avancement,d.total)+html;
    html+=d.parCategorie.map(c=>`<div class="cat-block"><h3>${esc(c.categorie)} (${c.projets.length})</h3>`+c.projets.map(p=>projetCard(p,suiviMap,d.avancement)).join('')+'</div>').join('');
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div class="note">Erreur de chargement.</div>'}
}

// Bloc portefeuille "Avancement (Taiga, temps réel)" — identique dans Projets/KPI/Finance/Stratégie,
// pour que "chaque évolution projet ait un impact" visible partout (demande de Julien du 24/08/2026),
// pas seulement dans l'onglet Projets.
function renderAvancementBlock(av,total){
  if(!av||!av.configured){return '<div class="note">Avancement live (Taiga) non configuré (TAIGA_USERNAME/TAIGA_PASSWORD manquants côté Vercel) — cet onglet affiche les données statiques ci-dessous en attendant.</div>'}
  if(av.error){return '<div class="note">Avancement live (Taiga) — erreur de connexion : '+esc(av.error)+'</div>'}
  const matches=Object.values(av.parProjetRegistre||{});
  const fait=matches.reduce((s,m)=>s+m.fait,0), enCours=matches.reduce((s,m)=>s+m.enCours,0), bloque=matches.reduce((s,m)=>s+m.bloque.length,0);
  let h='<div class="cat-block"><h3>Avancement — Taiga en temps réel</h3>';
  h+='<p class="muted" style="font-size:13px">'+matches.length+' projet(s) du registre relié(s) à un projet Taiga réel'+(total?' (sur '+total+')':'')+' — capturé à l\'instant ('+esc(av.capturedAt)+'). Le reste du portefeuille n\'a pas encore de projet Taiga créé : rien n\'est affiché à leur sujet plutôt que d\'inventer un état.</p>';
  h+='<div class="kpi-cards"><div class="kpi-card"><b>'+fait+'</b><span>Tâches faites</span></div><div class="kpi-card"><b>'+enCours+'</b><span>En cours</span></div><div class="kpi-card"><b>'+bloque+'</b><span>Bloquées</span></div></div>';
  const bloquants=matches.filter(m=>m.bloque.length);
  if(bloquants.length){
    h+='<table class="data"><tr><th>Projet</th><th>Blocage</th></tr>'+
      bloquants.flatMap(m=>{
        const nom=Object.keys(av.parProjetRegistre).find(k=>av.parProjetRegistre[k]===m);
        return m.bloque.map(b=>`<tr><td>${esc(nom)}</td><td>${esc(b.titre)}${b.note?' — <span class="muted">'+esc(b.note)+'</span>':''}</td></tr>`);
      }).join('')+'</table>';
  }
  if(av.projetsTaigaNonRapproches&&av.projetsTaigaNonRapproches.length){h+='<p class="muted" style="font-size:12px;margin-top:8px">Projets Taiga existants sans correspondance dans le registre : '+av.projetsTaigaNonRapproches.map(p=>esc(p.nom)).join(', ')+'</p>'}
  h+='</div>';
  return h;
}

const fmtNum=n=>{ if(n==null||isNaN(n)) return '—'; return Number(n).toLocaleString('fr-FR',{maximumFractionDigits:1}); };

// Tableau croisé dynamique KPI (objectifs vs réel) — graphes réels, ajoutés le 24/08/2026 après
// que Julien a vu la première version en tableau texte pur ("aucun graph rien") et demandé un rendu
// à la Odoo, les 3 métriques ensemble, dates en axe X. Un axe Y par métrique (jamais un double-axe —
// visites/adhésions/CA n'ont pas la même échelle), mais les 3 graphes d'un même projet partagent le
// même axe X (les jalons J7..J189 de l'e-mail du 21/08) : "small multiples" alignés, pas 3 échelles
// mélangées sur un seul graphe. Le point "aujourd'hui" est recalculé par le serveur à chaque
// chargement (api/kpi.js → objectifInterpoleAujourdhui) — pas une valeur figée. Le "réel" n'existe
// que pour les visites (Vercel Web Analytics) : adhésions et CA n'ont aucune mesure branchée, donc
// aucun point réel n'est dessiné pour ces deux métriques plutôt que d'inventer une valeur.
const TCD_UNITS={visites:'',adhesions:'',ca:'€'};

function tcdDateToX(dateISO,dateDepart,dateFin,xLeft,xRight){
  const t=new Date(dateISO)-new Date(dateDepart), tot=new Date(dateFin)-new Date(dateDepart);
  const frac=tot>0?Math.max(0,Math.min(1,t/tot)):0;
  return xLeft+frac*(xRight-xLeft);
}

function tcdMiniChart(metaKey,label,scenariosPts,dateDepart,todayISO,ajd,reelVal,reelDateISO){
  const W=280,H=150,padL=6,padR=10,padT=10,padB=22,xLeft=padL,xRight=W-padR,yTop=padT,yBot=H-padB;
  const dateFin=scenariosPts[scenariosPts.length-1].date;
  const allVals=[0];
  scenariosPts.forEach(p=>{allVals.push(p.pessimiste,p.normal,p.optimiste)});
  if(reelVal!=null)allVals.push(reelVal);
  const maxV=Math.max(...allVals)*1.08||1;
  const yOf=v=>yBot-(v/maxV)*(yBot-yTop);
  const xOf=d=>tcdDateToX(d,dateDepart,dateFin,xLeft,xRight);
  const pts=[{date:dateDepart,pessimiste:0,normal:0,optimiste:0},...scenariosPts];
  const lineNormal=pts.map(p=>`${xOf(p.date).toFixed(1)},${yOf(p.normal).toFixed(1)}`).join(' ');
  const bandTop=pts.map(p=>`${xOf(p.date).toFixed(1)},${yOf(p.optimiste).toFixed(1)}`).join(' L ');
  const bandBot=pts.slice().reverse().map(p=>`${xOf(p.date).toFixed(1)},${yOf(p.pessimiste).toFixed(1)}`).join(' L ');
  const bandPath=`M ${bandTop} L ${bandBot} Z`;
  const todayX=xOf(todayISO);
  const ajdY=yOf(ajd.normal);
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} — objectif vs réel">`;
  svg+=`<line x1="${xLeft}" y1="${yBot}" x2="${xRight}" y2="${yBot}" stroke="var(--viz-axis)" stroke-width="1"/>`;
  svg+=`<path d="${bandPath}" fill="var(--viz-band)" stroke="none"/>`;
  svg+=`<polyline points="${lineNormal}" fill="none" stroke="var(--viz-line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Objectif — scénario normal</title></polyline>`;
  if(todayX>=xLeft&&todayX<=xRight){
    svg+=`<line x1="${todayX.toFixed(1)}" y1="${yTop}" x2="${todayX.toFixed(1)}" y2="${yBot}" stroke="var(--viz-today)" stroke-width="1" stroke-dasharray="2,3"/>`;
    svg+=`<circle cx="${todayX.toFixed(1)}" cy="${ajdY.toFixed(1)}" r="3" fill="var(--viz-line)"><title>Objectif attendu aujourd'hui (${esc(todayISO)}) : ${fmtNum(ajd.normal)}${TCD_UNITS[metaKey]}</title></circle>`;
  }
  if(reelVal!=null&&reelDateISO){
    const rx=xOf(reelDateISO),ry=yOf(reelVal);
    svg+=`<circle cx="${rx.toFixed(1)}" cy="${ry.toFixed(1)}" r="4" fill="var(--viz-reel)" stroke="#fff" stroke-width="1.2"><title>Réel (${esc(reelDateISO)}) : ${fmtNum(reelVal)}${TCD_UNITS[metaKey]}</title></circle>`;
  }
  // repères d'axe X : dates de départ et de fin seulement (recessif, pas de grille)
  svg+=`<text x="${xLeft}" y="${H-6}" font-size="9" fill="var(--viz-text)">21/08</text>`;
  svg+=`<text x="${xRight}" y="${H-6}" font-size="9" fill="var(--viz-text)" text-anchor="end">${esc(pts[pts.length-1].horizon||'J189')}</text>`;
  svg+=`<text x="${xLeft}" y="${yTop+2}" font-size="9" fill="var(--viz-text)">${fmtNum(maxV/1.08)}${TCD_UNITS[metaKey]}</text>`;
  svg+='</svg>';
  return svg;
}

function tcdStatutPill(reelVal,ajd){
  if(reelVal==null)return '<span class="muted" style="font-size:11.5px">Réel non mesuré</span>';
  if(reelVal>=ajd.normal)return '<span class="status-pill good">Dans/au-dessus du scénario normal</span>';
  if(reelVal>=ajd.pessimiste)return '<span class="status-pill warn">Entre pessimiste et normal</span>';
  return '<span class="status-pill crit">Sous le scénario pessimiste</span>';
}

function renderTcdBlock(tcd){
  const objectifsParProjet=tcd.objectifsParProjet||[];
  let html='<div class="cat-block"><h3>Objectifs vs réel — par projet</h3>';
  html+=`<p class="muted" style="font-size:13px">${esc(tcd.note)}</p>`;
  objectifsParProjet.forEach(o=>{
    const pts=o.scenarios.normal.map((_,i)=>({
      date:o.scenarios.normal[i].date, horizon:o.scenarios.normal[i].horizon,
      pessimiste:o.scenarios.pessimiste[i], normal:o.scenarios.normal[i], optimiste:o.scenarios.optimiste[i],
    }));
    html+='<div class="tcd-project"><div class="tcd-project-head"><h4>'+esc(o.projet)+'</h4>'+tcdStatutPill(o.reelVisites30j,o.aujourdhui.visites)+'</div>';
    html+='<div class="tcd-legend"><span><span class="sw" style="background:var(--viz-line)"></span>Objectif (normal, plage pessimiste↔optimiste)</span><span><span class="sw" style="background:var(--viz-reel)"></span>Réel (visites 30j, Vercel Web Analytics)</span></div>';
    html+='<div class="tcd-charts">';
    tcd.metriques.forEach(m=>{
      const seriePts=pts.map(p=>({date:p.date,horizon:p.horizon,pessimiste:p.pessimiste[m.cle].cumul,normal:p.normal[m.cle].cumul,optimiste:p.optimiste[m.cle].cumul}));
      const reelVal=m.cle==='visites'?o.reelVisites30j:null;
      html+='<div class="tcd-chart-box"><div class="tcd-chart-title">'+esc(m.label)+' — cumulé</div>'+
        tcdMiniChart(m.cle,m.label,seriePts,tcd.dateDepart,tcd.aujourdhui,o.aujourdhui[m.cle],reelVal,tcd.aujourdhui)+
        '</div>';
    });
    html+='</div></div>';
  });
  html+='</div>';
  return html;
}

async function taigaSeedExecute(){
  const resultBox=document.getElementById('taiga-seed-result');
  resultBox.textContent='Création en cours dans Taiga…';
  try{
    const r=await fetch('/api/taiga-seed',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({dryRun:false})});
    const d=await r.json();
    if(!r.ok){resultBox.textContent='Erreur : '+(d.error||('HTTP '+r.status));return}
    const ok=d.crees.filter(c=>c.ok).length,ko=d.crees.filter(c=>!c.ok).length;
    resultBox.innerHTML=ok+' projet(s) créé(s) dans Taiga'+(ko?(', '+ko+' en erreur'):'')+'.'+
      '<ul class="suivi-tasks">'+d.crees.map(c=>c.ok?`<li>✅ <a href="https://taiga.dyonysos.fr/project/${esc(c.slug)}/" target="_blank" rel="noopener">${esc(c.name)}</a> — ${c.taches.filter(t=>t.ok).length}/${c.taches.length} tâches créées</li>`:`<li>❌ ${esc(c.name)} — ${esc(c.error)}</li>`).join('')+'</ul>';
    loadCrm();
  }catch(e){resultBox.textContent='Erreur réseau.'}
}

async function loadCrm(){
  const el=document.getElementById('crm-content');
  try{
    const r=await fetch('/api/crm',{credentials:'same-origin'});
    const d=await r.json();
    let html='';
    html+=`<p class="muted">Ci-dessous : ce que contient Odoo aujourd'hui (source : base connectée à pet-stone.shop) — instantané du ${esc(d.capturedAt)}. Affiché à titre de preuve du diagnostic, pas comme le vrai CRM.</p>`;
    html+=`<div class="note">${esc(d.constat)}</div>`;
    const t=d.totaux;
    html+='<div class="kpi-cards">'+
      `<div class="kpi-card"><b>${t.leadsBruts}</b><span>Leads bruts (captures email)</span></div>`+
      `<div class="kpi-card"><b>${t.opportunites}</b><span>Opportunités (type CRM)</span></div>`+
      `<div class="kpi-card"><b>${t.perdues}</b><span>Marquées "Perdu"</span></div>`+
      `<div class="kpi-card"><b>${t.partenaires.toLocaleString('fr-FR')}</b><span>Fiches partenaires (base entière)</span></div>`+
      `<div class="kpi-card"><b>${t.partenairesDyonysos}</b><span>Contacts @dyonysos.be identifiés</span></div>`+
      '</div>';
    html+='<div class="cat-block"><h3>Étapes du pipeline Odoo</h3><table class="data"><tr><th>#</th><th>Étape</th></tr>'+
      d.stages.map(s=>`<tr><td class="num">${s.id}</td><td>${esc(s.name)}</td></tr>`).join('')+'</table></div>';
    html+='<div class="cat-block"><h3>Les 5 opportunités marquées "Perdu"</h3><table class="data"><tr><th>Titre</th><th>Contact</th></tr>'+
      d.perdues.map(p=>`<tr><td>${esc(p.titre)}</td><td class="muted">${p.contact?esc(p.contact):'—'}</td></tr>`).join('')+'</table></div>';
    html+='<div class="cat-block"><h3>Contacts @dyonysos.be identifiés dans Odoo</h3><table class="data"><tr><th>Adresse</th><th>Rôle</th></tr>'+
      d.contactsDyonysos.map(c=>`<tr><td>${esc(c.nom)}</td><td class="muted">${esc(c.role)}</td></tr>`).join('')+'</table></div>';
    html+=`<div class="cat-block"><h3>CRM par projet, piloté par email</h3><p class="muted">${esc(d.emailsScope.demande)}</p><p class="muted"><strong>État :</strong> ${esc(d.emailsScope.etat)}</p></div>`;
    html+=`<div class="note">${esc(d.commentPasserEnLive)}</div>`;
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div class="note">Erreur de chargement.</div>'}
}

async function taigaPilotCreateStory(){
  const projectId=document.getElementById('taiga-pilot-project').value;
  const subjectEl=document.getElementById('taiga-pilot-subject');
  const subject=subjectEl.value.trim();
  const msg=document.getElementById('taiga-pilot-msg');
  if(!subject){msg.textContent='Titre requis.';return}
  msg.textContent='Création en cours…';
  try{
    const r=await fetch('/api/taiga-actions',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create_story',projectId:Number(projectId),subject})});
    const d=await r.json();
    if(!r.ok||!d.ok){msg.textContent='Erreur : '+(d.error||('HTTP '+r.status));return}
    msg.textContent='Créé dans Taiga : "'+subject+'".';
    subjectEl.value='';
    loadCrm();
  }catch(e){msg.textContent='Erreur réseau.'}
}

async function loadStrategie(){
  const el=document.getElementById('strategie-content');
  try{
    const r=await fetch('/api/strategie',{credentials:'same-origin'});
    const d=await r.json();
    const p=d.portefeuille;
    let html=(d.avancement?renderAvancementBlock(d.avancement):'')+'<div class="kpi-cards">'+
      `<div class="kpi-card"><b>${p.projetsActifs}</b><span>Projets actifs (avec URL)</span></div>`+
      `<div class="kpi-card"><b>${p.urgents.length}</b><span>Urgents</span></div>`+
      `<div class="kpi-card"><b>${p.meilleurTrafic30j?p.meilleurTrafic30j.v:'—'}</b><span>Meilleur trafic 30j${p.meilleurTrafic30j?' ('+esc(p.meilleurTrafic30j.name)+')':''}</span></div>`+
      `<div class="kpi-card"><b>${p.projetsAZeroVisiteur.length}</b><span>Projets à 0 visiteur mesuré</span></div>`+
      '</div>';
    if(p.urgents.length){html+='<div class="note"><strong>Urgents : </strong>'+p.urgents.map(esc).join(', ')+'</div>'}
    html+='<div class="cat-block"><h3>Projets prioritaires</h3><table class="data"><tr><th>Projet</th><th>Priorité</th><th>Trafic 30j</th><th>Piste d\'optimisation</th></tr>'+
      d.projetsPrioritaires.map(pp=>`<tr><td>${esc(pp.name)}</td><td>${esc(pp.priorite)}</td><td class="num">${pp.trafic30j==null?'—':pp.trafic30j}</td><td class="muted">${esc(pp.pisteOptimisation||'—')}</td></tr>`).join('')+'</table></div>';
    html+='<div class="cat-block"><h3>Concurrents / benchmarks</h3><table class="data"><tr><th>Projet</th><th>Concurrents identifiés</th><th>État</th></tr>'+
      d.benchmarks.map(b=>`<tr><td>${esc(b.projet)}</td><td class="muted">${esc(b.concurrentsIdentifies)}</td><td>${esc(b.etat)}</td></tr>`).join('')+'</table></div>';
    const v=d.veille;
    html+=`<div class="cat-block"><h3>Veille &amp; tendances par projet</h3><div class="note">${esc(v.constat)}</div>`+
      '<table class="data"><tr><th>Projet</th><th>Mots-clés de veille</th><th>Domaines connexes</th></tr>'+
      v.parProjet.map(pv=>`<tr><td>${esc(pv.projet)}</td><td class="muted">${pv.motsCles.map(esc).join(', ')}</td><td class="muted">${pv.domainesConnexes.map(esc).join(', ')}</td></tr>`).join('')+'</table></div>';
    html+='<div class="cat-block"><h3>Domaines connexes — niveau portefeuille</h3><table class="data"><tr><th>Cluster</th><th>Connexe à</th><th>Raison</th></tr>'+
      v.domainesConnexesPortefeuille.map(c=>`<tr><td>${esc(c.cluster)}</td><td class="muted">${esc(c.connexeA)}</td><td class="muted">${esc(c.raison)}</td></tr>`).join('')+'</table></div>';
    html+=`<div class="note">${esc(v.commentBrancherVeille)}</div>`;
    if(d.bmcSwot){
      html+='<div class="cat-block"><h3>Business Model Canvas &amp; SWOT — projets urgents</h3><div class="note">'+esc(d.bmcSwot.note)+'</div>';
      Object.entries(d.bmcSwot.projets).forEach(([nom,proj])=>{
        let marches=d.marcheParProjet&&d.marcheParProjet[nom]?[d.marcheParProjet[nom]]:[];
        if(!marches.length&&d.marcheParProjet){marches=Object.keys(d.marcheParProjet).filter(k=>k.startsWith(nom+' (')).map(k=>d.marcheParProjet[k])}
        html+=`<details class="proj"><summary>${esc(nom)}</summary><div class="body">`;
        marches.forEach(marche=>{
          if(marche.correctifImportant){html+='<div class="suivi-flag"><span class="tag">Correction factuelle</span>'+esc(marche.correctifImportant)+'</div>'}
          if(marche.marche){html+='<p class="muted" style="font-size:13px"><strong>Marché : </strong>'+esc(marche.marche)+'</p>'}
          if(marche.concurrents&&marche.concurrents.length){html+='<table class="data"><tr><th>Concurrent</th><th>Positionnement</th><th>Prix</th><th>Source</th></tr>'+
            marche.concurrents.map(c=>`<tr><td>${esc(c.nom)}</td><td class="muted">${esc(c.note)}</td><td class="num">${esc(c.prix)}</td><td><a href="${esc(c.source)}" target="_blank" rel="noopener noreferrer">source →</a></td></tr>`).join('')+'</table>'}
          if(marche.positionnement){html+='<p class="muted" style="font-size:13px;margin-top:8px">'+esc(marche.positionnement)+'</p>'}
        });
        const bmcLabels={segmentsClients:'Segments clients',propositionValeur:'Proposition de valeur',canaux:'Canaux',relationClient:'Relation client',revenus:'Revenus',ressourcesCles:'Ressources clés',activitesCles:'Activités clés',partenairesCles:'Partenaires clés',structureCouts:'Structure de coûts'};
        const renderBmc=b=>'<dl>'+Object.entries(bmcLabels).map(([k,label])=>b[k]?`<dt>${label}</dt><dd>${esc(b[k])}</dd>`:'').join('')+'</dl>';
        if(proj.bmc){html+='<h4 style="margin:14px 0 6px">Business Model Canvas</h4>'+renderBmc(proj.bmc)}
        if(proj.bmcTinderpp){html+='<h4 style="margin:14px 0 6px">Business Model Canvas — Tinder++</h4>'+renderBmc(proj.bmcTinderpp)}
        if(proj.bmcMympp){html+='<h4 style="margin:14px 0 6px">Business Model Canvas — Mym++</h4>'+renderBmc(proj.bmcMympp)}
        if(proj.swot){const s=proj.swot;html+='<h4 style="margin:14px 0 6px">SWOT</h4>';
          if(s.note){html+='<p class="muted" style="font-size:12.5px">'+esc(s.note)+'</p>'}
          html+='<div class="suivi-stats" style="grid-template-columns:repeat(2,1fr)">'+
            ['forces','faiblesses','opportunites','menaces'].map(k=>{const labels={forces:'Forces',faiblesses:'Faiblesses',opportunites:'Opportunités',menaces:'Menaces'};return s[k]&&s[k].length?`<div style="text-align:left"><span style="text-transform:uppercase;font-weight:900;font-size:11px;color:var(--n)">${labels[k]}</span><ul class="suivi-tasks">${s[k].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}).join('')+
            '</div>';
        }
        html+='</div></details>';
      });
      html+='</div>';
    }
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div class="note">Erreur de chargement.</div>'}
}

const loaders={api:loadApiAcces,social:loadSocial,projets:loadProjets,finance:loadFinance,kpi:loadKpi,crm:loadCrm,strategie:loadStrategie};
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  const tab=btn.dataset.tab;
  document.getElementById('panel-'+tab).classList.add('active');
  if(loaders[tab] && !loaded[tab]){loaded[tab]=true;loaders[tab]()}
}));

render();
</script><script src="/common.js" defer></script></body></html>
