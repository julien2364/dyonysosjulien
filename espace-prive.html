<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Accès privé — Dyonysos</title><style>:root{--n:#08233f;--b:#1688d8;--t:#26384a;--m:#667789;--l:#d7e5ee;--s:#f3f8fb;--g:#198765}*{box-sizing:border-box}body{margin:0;font:16px/1.55 Arial,sans-serif;color:var(--t);background:var(--s)}.wrap{max-width:1100px;margin:auto;padding:0 24px}header{background:#fff;border-bottom:1px solid var(--l)}nav{height:78px;display:flex;align-items:center}nav img{width:165px}nav a:last-child{margin-left:auto;color:var(--t);text-decoration:none;font-weight:700}.hero{background:linear-gradient(115deg,#071f39,#0c466c);color:#fff;padding:55px 0}.hero h1{font-size:44px;margin:0 0 8px}.hero p{color:#cbddeb}.login{max-width:470px;margin:55px auto;background:#fff;border:1px solid var(--l);border-radius:12px;padding:30px;box-shadow:0 25px 70px #0b315110}.field{margin-bottom:17px}label{display:block;font-weight:800;font-size:14px;margin-bottom:7px}input{width:100%;padding:13px;border:1px solid #b9cad7;border-radius:6px;font:inherit}button{border:0;background:var(--b);color:#fff;padding:13px 20px;border-radius:6px;font-weight:800;cursor:pointer}.error{color:#b32631;font-weight:700}.dashboard{padding:50px 24px}.dashhead{display:flex;justify-content:space-between;align-items:center}.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:28px}.group{background:#fff;border:1px solid var(--l);border-radius:10px;padding:24px}.group h2{color:var(--n);font-size:20px;margin-top:0}.link{padding:13px 0;border-top:1px solid var(--l)}.link a{color:var(--b);font-weight:800;text-decoration:none}.status{display:block;color:var(--m);font-size:13px;margin-top:3px}.sensitive{color:#9b5b00;font-size:11px;font-weight:900;text-transform:uppercase;margin-left:7px}.hidden{display:none}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:28px;border-bottom:1px solid var(--l)}.tab{padding:11px 18px;border:0;background:none;color:var(--m);font-weight:800;cursor:pointer;border-bottom:3px solid transparent;font-size:15px}.tab.active{color:var(--n);border-bottom-color:var(--b)}.panel{display:none;padding-top:26px}.panel.active{display:block}.note{background:#fff8e8;border:1px solid #f0dca0;border-radius:8px;padding:14px 16px;font-size:14px;color:#6b5300;margin-bottom:18px}.kpi-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}.kpi-card{background:#fff;border:1px solid var(--l);border-radius:10px;padding:16px}.kpi-card b{display:block;font-size:26px;color:var(--n)}.kpi-card span{font-size:13px;color:var(--m)}table.data{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--l);border-radius:10px;overflow:hidden;font-size:14px}table.data th,table.data td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--l)}table.data th{background:var(--s);color:var(--n)}table.data td.num{text-align:right;font-variant-numeric:tabular-nums}.muted{color:var(--m)}.cat-block{margin-bottom:22px}.cat-block h3{color:var(--n);margin-bottom:8px}.prio{display:inline-block;font-size:11px;font-weight:900;text-transform:uppercase;padding:2px 8px;border-radius:20px;margin-left:6px}.prio-urgent{background:#fbe1e1;color:#a11d1d}.prio-normal{background:#e4f0e9;color:#1b6b45}.prio-autre{background:#eef1f4;color:var(--m)}details.proj{background:#fff;border:1px solid var(--l);border-radius:10px;margin-bottom:10px;padding:0}details.proj summary{cursor:pointer;padding:14px 16px;font-weight:800;color:var(--n);list-style:none;display:flex;align-items:center;gap:8px}details.proj summary::-webkit-details-marker{display:none}details.proj summary::before{content:'+';display:inline-block;width:18px;color:var(--b);font-weight:900}details.proj[open] summary::before{content:'–'}details.proj .body{padding:0 16px 16px;border-top:1px solid var(--l)}details.proj .body dl{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:14px;margin:12px 0}details.proj .body dt{color:var(--m)}details.proj .body ul{margin:6px 0 0;padding-left:18px}@media(max-width:720px){.groups{grid-template-columns:1fr}.hero h1{font-size:36px}table.data{font-size:12.5px}details.proj .body dl{grid-template-columns:1fr}}</style><link rel="stylesheet" href="/common.css"><link rel="stylesheet" href="/theme.css"></head><body><header><nav class="wrap"><a href="/"><img src="/logo-dyonysos-wordmark.png" alt="Dyonysos"></a><a href="/">Retour au site public</a></nav></header><section class="hero"><div class="wrap"><h1>Espace privé Dyonysos</h1><p>Accès réservé à l’administration et aux projets internes.</p></div></section><main><form id="loginForm" class="login"><h2>Connexion</h2><div class="field"><label for="email">Identifiant</label><input id="email" name="email" type="email" required autocomplete="username"></div><div class="field"><label for="password">Mot de passe</label><input id="password" name="password" type="password" required autocomplete="current-password"></div><button type="submit">Se connecter</button><p id="loginStatus" role="status"></p></form><section id="dashboard" class="wrap dashboard hidden"><div class="dashhead"><div><h2>Pilotage Dyonysos</h2><p>Les liens et données sensibles ne sont pas affichés sur la vitrine publique.</p></div><button id="logout">Déconnexion</button></div>
<div class="tabs" role="tablist">
<button class="tab active" data-tab="liens">Modules &amp; liens</button>
<button class="tab" data-tab="social">Réseaux sociaux</button>
<button class="tab" data-tab="projets">Projets</button>
<button class="tab" data-tab="finance">Finance</button>
<button class="tab" data-tab="kpi">KPI</button>
</div>
<div id="panel-liens" class="panel active"><div id="groups" class="groups"></div></div>
<div id="panel-social" class="panel"><div id="social-content" class="muted">Chargement…</div></div>
<div id="panel-projets" class="panel"><div id="projets-content" class="muted">Chargement…</div></div>
<div id="panel-finance" class="panel"><div id="finance-content" class="muted">Chargement…</div></div>
<div id="panel-kpi" class="panel"><div id="kpi-content" class="muted">Chargement…</div></div>
</section></main><script>
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const loaded={};
const render=async()=>{const r=await fetch('/api/private-links',{credentials:'same-origin'});if(!r.ok){loginForm.classList.remove('hidden');dashboard.classList.add('hidden');return}const data=await r.json();loginForm.classList.add('hidden');dashboard.classList.remove('hidden');groups.innerHTML=data.groups.map(g=>`<section class="group"><h2>${g.title}</h2>${g.links.map(l=>`<div class="link">${l.url?`<a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.name} →</a>`:`<strong>${l.name}</strong>`}${l.sensitive?'<span class="sensitive">Confidentiel</span>':''}${l.status?`<span class="status">${l.status}</span>`:''}</div>`).join('')}</section>`).join('')};
loginForm.addEventListener('submit',async e=>{e.preventDefault();loginStatus.textContent='Connexion…';loginStatus.className='';const body=Object.fromEntries(new FormData(loginForm));const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok){loginStatus.textContent=data.error||'Connexion impossible.';loginStatus.className='error';return}loginForm.reset();await render()});
logout.addEventListener('click',async()=>{await fetch('/api/logout',{method:'POST'});location.reload()});

async function loadSocial(){
  const el=document.getElementById('social-content');
  try{
    const r=await fetch('/api/pilotage-social/reseaux',{credentials:'same-origin'});
    const d=await r.json();
    let html='';
    if(!d.sheetsConfigure){html+='<div class="note">Google Sheets (Content Engine) non configuré — les statuts de connexion par projet ne peuvent pas encore être lus. Le reste (comptes Google, indexation, réseaux sociaux) est affiché ci-dessous.</div>'}
    html+='<div class="cat-block"><h3>Comptes Google</h3><table class="data"><tr><th>Compte</th><th>Usage</th></tr>'+d.comptesGoogle.comptes.map(c=>`<tr><td>${esc(c.email)}</td><td>${esc(c.usage)}</td></tr>`).join('')+'</table></div>';
    html+=`<div class="cat-block"><h3>Indexation Google (Search Console)</h3><p class="muted">${esc(d.indexationGoogle.note)}</p><table class="data"><tr><th>Date</th><th>Alerte</th></tr>`+d.indexationGoogle.alertesRecentes.map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.sujet)}</td></tr>`).join('')+'</table></div>';
    if(d.projets.length){html+='<div class="cat-block"><h3>Connexions par projet</h3><table class="data"><tr><th>Projet</th><th>LinkedIn</th><th>Facebook</th><th>Instagram</th><th>TikTok</th><th>YouTube</th></tr>'+d.projets.map(p=>`<tr><td>${esc(p.name)}</td>`+p.connexions.map(c=>`<td>${c.connecte?'✅':'—'}</td>`).join('')+'</tr>').join('')+'</table></div>'}
    html+=`<div class="note">${esc(d.reseauxSociauxOAuth.note)}</div>`;
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div class="note">Erreur de chargement.</div>'}
}

function prioBadge(p){
  if(!p)return'';
  const cls=p.startsWith('urgent')?'prio-urgent':(p.startsWith('normal')?'prio-normal':'prio-autre');
  return `<span class="prio ${cls}">${esc(p)}</span>`;
}
function projetCard(p){
  const dl=[
    ['URL', p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.url)}</a>`:'<span class="muted">—</span>'],
    ['GitHub', p.github?esc(p.github):'<span class="muted">—</span>'],
    ['Drive', p.drive?esc(p.drive):'<span class="muted">—</span>'],
    ['Local', p.local?esc(p.local):'<span class="muted">—</span>'],
    ['Dernier pilotage', p.dernierPilotage?esc(p.dernierPilotage):'<span class="muted">—</span>'],
  ];
  if(p.etat) dl.push(['État', esc(p.etat)]);
  let body='<dl>'+dl.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')+'</dl>';
  if(p.taches&&p.taches.length){body+='<div><strong>Tâches en cours / à réaliser</strong><ul>'+p.taches.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul></div>'}
  if(p.note){body+=`<p class="muted" style="margin-top:10px">↳ ${esc(p.note)}</p>`}
  return `<details class="proj"><summary>${esc(p.name)}${prioBadge(p.priorite)}</summary><div class="body">${body}</div></details>`;
}
async function loadProjets(){
  const el=document.getElementById('projets-content');
  try{
    const r=await fetch('/api/registre-projets',{credentials:'same-origin'});
    const d=await r.json();
    let html=`<p class="muted">${d.total} projets recensés — dernière vérification ${esc(d.updatedAt)}. Clique sur un projet pour dérouler ses infos, son état et ses tâches.</p>`;
    if(d.urgents&&d.urgents.length){html+='<div class="note"><strong>Priorités du moment : </strong>'+d.urgents.map(u=>esc(u.name)).join(', ')+'</div>'}
    html+=d.parCategorie.map(c=>`<div class="cat-block"><h3>${esc(c.categorie)} (${c.projets.length})</h3>`+c.projets.map(projetCard).join('')+'</div>').join('');
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div class="note">Erreur de chargement.</div>'}
}

async function loadFinance(){
  const el=document.getElementById('finance-content');
  try{
    const r=await fetch('/api/finance',{credentials:'same-origin'});
    const d=await r.json();
    let html=`<div class="note">${esc(d.avertissement)}</div>`;
    html+=`<div class="kpi-cards"><div class="kpi-card"><b>${d.totalRetenu.toFixed(2)} €</b><span>Total retenu (dépenses confirmées)</span></div></div>`;
    html+='<div class="cat-block"><h3>Dépenses (source : notifications Qonto)</h3><table class="data"><tr><th>Date</th><th>Fournisseur</th><th>Montant</th><th>Note</th></tr>'+
      d.depenses.map(dep=>`<tr><td>${esc(dep.date)}</td><td>${esc(dep.fournisseur)}</td><td class="num">${dep.annulee?'<s>':''}${dep.montant.toFixed(2)} ${esc(dep.devise)}${dep.annulee?'</s>':''}</td><td class="muted">${esc(dep.note||'')}</td></tr>`).join('')+'</table></div>';
    if(d.stripe){html+=`<div class="cat-block"><h3>Revenus — Stripe</h3><p class="muted">${esc(d.stripe.note)}</p></div>`}
    html+='<div class="cat-block"><h3>À relier / à dépouiller</h3><table class="data"><tr><th>Sujet</th><th>Détail</th></tr>'+
      d.aRelier.map(a=>`<tr><td>${esc(a.sujet)}</td><td>${esc(a.detail)}</td></tr>`).join('')+'</table></div>';
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div class="note">Erreur de chargement.</div>'}
}

async function loadKpi(){
  const el=document.getElementById('kpi-content');
  try{
    const r=await fetch('/api/kpi',{credentials:'same-origin'});
    const d=await r.json();
    const p=d.portefeuille;
    let html='<div class="kpi-cards">'+
      `<div class="kpi-card"><b>${p.total}</b><span>Projets recensés</span></div>`+
      `<div class="kpi-card"><b>${p.actifs}</b><span>Avec URL active</span></div>`+
      `<div class="kpi-card"><b>${p.avecGithub}</b><span>Avec dépôt GitHub identifié</span></div>`+
      `<div class="kpi-card"><b>${p.avecDrive}</b><span>Avec dossier Drive identifié</span></div>`+
      `<div class="kpi-card"><b>${p.aNettoyer+p.aIdentifier}</b><span>À nettoyer / à identifier</span></div>`+
      '</div>';
    if(p.urgents&&p.urgents.length){html+='<div class="note"><strong>Priorités du moment : </strong>'+p.urgents.map(u=>esc(u.name)).join(', ')+'</div>'}
    html+='<div class="cat-block"><h3>Répartition par catégorie</h3><table class="data"><tr><th>Catégorie</th><th>Projets</th></tr>'+
      Object.entries(p.parCategorie).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v}</td></tr>`).join('')+'</table></div>';
    const t=d.trafic;
    html+=`<div class="cat-block"><h3>Trafic (Vercel Web Analytics — instantané du ${esc(t.capturedAt)})</h3><table class="data"><tr><th>Projet</th><th>1j</th><th>7j</th><th>30j</th></tr>`+
      t.parProjet.map(pr=>{const per=pr.periodes;const cell=x=>x?`${x.visiteurs} vis. / ${x.pageviews} vues`:'<span class="muted">—</span>';return `<tr><td>${esc(pr.name)}</td><td>${cell(per['1j'])}</td><td>${cell(per['7j'])}</td><td>${cell(per['30j'])}</td></tr>`}).join('')+'</table></div>';
    const principal=t.parProjet[0];
    if(principal&&principal.pays30j){html+='<div class="cat-block"><h3>dyonysos.fr — visites par pays (30j)</h3><table class="data"><tr><th>Pays</th><th>Visiteurs</th><th>Pages vues</th></tr>'+principal.pays30j.map(c=>`<tr><td>${esc(c.pays)}</td><td class="num">${c.visiteurs}</td><td class="num">${c.pageviews}</td></tr>`).join('')+'</table></div>'}
    html+=`<div class="note">${esc(t.commentPasserEnLive)}</div>`;
    html+=`<div class="note">Indexation Google : ${esc(d.indexation.note)}</div>`;
    html+=`<div class="note">Domaine ${esc(d.domaine.nom)} (${esc(d.domaine.registrar)}) : ${esc(d.domaine.renouvellement)}</div>`;
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div class="note">Erreur de chargement.</div>'}
}

const loaders={social:loadSocial,projets:loadProjets,finance:loadFinance,kpi:loadKpi};
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  const tab=btn.dataset.tab;
  document.getElementById('panel-'+tab).classList.add('active');
  if(loaders[tab] && !loaded[tab]){loaded[tab]=true;loaders[tab]()}
}));

render();
</script><script src="/common.js" defer></script></body></html>
