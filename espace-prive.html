<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Accès privé — Dyonysos</title><style>:root{--n:#08233f;--b:#1688d8;--t:#26384a;--m:#667789;--l:#d7e5ee;--s:#f3f8fb;--g:#198765}*{box-sizing:border-box}body{margin:0;font:16px/1.55 Arial,sans-serif;color:var(--t);background:var(--s)}.wrap{max-width:1100px;margin:auto;padding:0 24px}header{background:#fff;border-bottom:1px solid var(--l)}nav{height:78px;display:flex;align-items:center}nav img{width:165px}nav a:last-child{margin-left:auto;color:var(--t);text-decoration:none;font-weight:700}.hero{background:linear-gradient(115deg,#071f39,#0c466c);color:#fff;padding:55px 0}.hero h1{font-size:44px;margin:0 0 8px}.hero p{color:#cbddeb}.login{max-width:470px;margin:55px auto;background:#fff;border:1px solid var(--l);border-radius:12px;padding:30px;box-shadow:0 25px 70px #0b315110}.field{margin-bottom:17px}label{display:block;font-weight:800;font-size:14px;margin-bottom:7px}input{width:100%;padding:13px;border:1px solid #b9cad7;border-radius:6px;font:inherit}button{border:0;background:var(--b);color:#fff;padding:13px 20px;border-radius:6px;font-weight:800;cursor:pointer}.error{color:#b32631;font-weight:700}.dashboard{padding:50px 24px}.dashhead{display:flex;justify-content:space-between;align-items:center}.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:28px}.group{background:#fff;border:1px solid var(--l);border-radius:10px;padding:24px}.group h2{color:var(--n);font-size:20px;margin-top:0}.link{padding:13px 0;border-top:1px solid var(--l)}.link a{color:var(--b);font-weight:800;text-decoration:none}.status{display:block;color:var(--m);font-size:13px;margin-top:3px}.sensitive{color:#9b5b00;font-size:11px;font-weight:900;text-transform:uppercase;margin-left:7px}.hidden{display:none}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:28px;border-bottom:1px solid var(--l)}.tab{padding:11px 18px;border:0;background:none;color:var(--m);font-weight:800;cursor:pointer;border-bottom:3px solid transparent;font-size:15px}.tab.active{color:var(--n);border-bottom-color:var(--b)}.panel{display:none;padding-top:26px}.panel.active{display:block}.note{background:#fff8e8;border:1px solid #f0dca0;border-radius:8px;padding:14px 16px;font-size:14px;color:#6b5300;margin-bottom:18px}.kpi-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}.kpi-card{background:#fff;border:1px solid var(--l);border-radius:10px;padding:16px}.kpi-card b{display:block;font-size:26px;color:var(--n)}.kpi-card span{font-size:13px;color:var(--m)}table.data{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--l);border-radius:10px;overflow:hidden;font-size:14px}table.data th,table.data td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--l)}table.data th{background:var(--s);color:var(--n)}table.data td.num{text-align:right;font-variant-numeric:tabular-nums}.muted{color:var(--m)}.cat-block{margin-bottom:22px}.cat-block h3{color:var(--n);margin-bottom:8px}.prio{display:inline-block;font-size:11px;font-weight:900;text-transform:uppercase;padding:2px 8px;border-radius:20px;margin-left:6px}.prio-urgent{background:#fbe1e1;color:#a11d1d}.prio-normal{background:#e4f0e9;color:#1b6b45}.prio-autre{background:#eef1f4;color:var(--m)}details.proj{background:#fff;border:1px solid var(--l);border-radius:10px;margin-bottom:10px;padding:0}details.proj summary{cursor:pointer;padding:14px 16px;font-weight:800;color:var(--n);list-style:none;display:flex;align-items:center;gap:8px}details.proj summary::-webkit-details-marker{display:none}details.proj summary::before{content:'+';display:inline-block;width:18px;color:var(--b);font-weight:900}details.proj[open] summary::before{content:'–'}details.proj .body{padding:0 16px 16px;border-top:1px solid var(--l)}details.proj .body dl{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:14px;margin:12px 0}details.proj .body dt{color:var(--m)}details.proj .body ul{margin:6px 0 0;padding-left:18px}.suivi-wrap{margin-top:14px;padding-top:14px;border-top:1px dashed var(--l)}.suivi-wrap h4{margin:14px 0 6px;color:var(--n);font-size:13px}.suivi-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:1px;background:var(--l);border:1px solid var(--l);border-radius:8px;overflow:hidden;margin-bottom:12px}.suivi-stats div{background:#fff;padding:8px 10px}.suivi-stats b{display:block;font-size:17px;color:var(--n)}.suivi-stats span{font-size:10.5px;color:var(--m);text-transform:uppercase;letter-spacing:.03em}.suivi-decision{background:#eaf6f1;border:1px solid #b7ddc9;border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:13px}.suivi-decision .tag{font-size:11px;font-weight:900;text-transform:uppercase;color:#1b6b45;display:block;margin-bottom:4px}.suivi-decision .qui{font-size:12px;color:var(--m);display:block;margin-top:6px}.suivi-flag{background:#fff8e8;border:1px solid #f0dca0;border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:13px}.suivi-flag .tag{font-size:11px;font-weight:900;text-transform:uppercase;color:#8a5a00;display:block;margin-bottom:4px}.pill{display:inline-block;font-size:10px;font-weight:900;text-transform:uppercase;padding:2px 7px;border-radius:20px;margin-right:6px}.pill-ok{background:#e3f3e7;color:#1e7a3d}.pill-warn{background:#fbeeda;color:#a9700d}.pill-crit{background:#f7e3df;color:#a7332b}.pill-muted{background:#eef1f4;color:var(--m)}.suivi-tasks{list-style:none;margin:0 0 4px;padding:0;font-size:12.5px}.suivi-tasks li{padding:5px 0;border-bottom:1px solid var(--l)}.suivi-tasks li:last-child{border-bottom:none}.suivi-idtag{font-family:monospace;font-size:10.5px;color:var(--m);margin-right:4px}.suivi-block{background:var(--s);border:1px solid var(--l);border-radius:8px;padding:12px 14px;margin-bottom:10px}.suivi-block h5{margin:0 0 4px}.suivi-block p{margin:0 0 8px;font-size:12px;color:var(--m)}.suivi-block ul{list-style:none;margin:0;padding:0;font-size:12.5px}.suivi-block li{padding:3px 0}.suivi-delivered{font-size:12.5px;margin-bottom:4px}.suivi-delivered .row{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--l)}.suivi-delivered .row:last-child{border-bottom:none}.suivi-delivered .time{color:var(--m);flex:0 0 48px}.suivi-access{font-size:13px;margin-bottom:4px}.suivi-access div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dotted var(--l)}.suivi-steps{margin:0;padding-left:18px;font-size:12.5px;color:var(--m)}@media(max-width:720px){.groups{grid-template-columns:1fr}.hero h1{font-size:36px}table.data{font-size:12.5px}details.proj .body dl{grid-template-columns:1fr}}</style><link rel="stylesheet" href="/common.css"><link rel="stylesheet" href="/theme.css"></head><body><header><nav class="wrap"><a href="/"><img src="/logo-dyonysos-wordmark.png" alt="Dyonysos"></a><a href="/">Retour au site public</a></nav></header><section class="hero"><div class="wrap"><h1>Espace privé Dyonysos</h1><p>Accès réservé à l’administration et aux projets internes.</p></div></section><main><form id="loginForm" class="login"><h2>Connexion</h2><div class="field"><label for="email">Identifiant</label><input id="email" name="email" type="email" required autocomplete="username"></div><div class="field"><label for="password">Mot de passe</label><input id="password" name="password" type="password" required autocomplete="current-password"></div><button type="submit">Se connecter</button><p id="loginStatus" role="status"></p></form><section id="dashboard" class="wrap dashboard hidden"><div class="dashhead"><div><h2>Pilotage Dyonysos</h2><p>Les liens et données sensibles ne sont pas affichés sur la vitrine publique.</p></div><button id="logout">Déconnexion</button></div>
<div class="tabs" role="tablist">
<button class="tab active" data-tab="liens">Modules &amp; liens</button>
<button class="tab" data-tab="social">Réseaux sociaux</button>
<button class="tab" data-tab="projets">Projets</button>
<button class="tab" data-tab="finance">Finance</button>
<button class="tab" data-tab="kpi">KPI</button>
<button class="tab" data-tab="crm">CRM</button>
<button class="tab" data-tab="strategie">Stratégie</button>
</div>
<div id="panel-liens" class="panel active"><div id="groups" class="groups"></div></div>
<div id="panel-social" class="panel"><div id="social-content" class="muted">Chargement…</div></div>
<div id="panel-projets" class="panel"><div id="projets-content" class="muted">Chargement…</div></div>
<div id="panel-finance" class="panel"><div id="finance-content" class="muted">Chargement…</div></div>
<div id="panel-kpi" class="panel"><div id="kpi-content" class="muted">Chargement…</div></div>
<div id="panel-crm" class="panel"><div id="crm-content" class="muted">Chargement…</div></div>
<div id="panel-strategie" class="panel"><div id="strategie-content" class="muted">Chargement…</div></div>
</section></main><script>
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const loaded={};
const render=async()=>{const r=await fetch('/api/private-links',{credentials:'same-origin'});if(!r.ok){loginForm.classList.remove('hidden');dashboard.classList.add('hidden');return}const data=await r.json();loginForm.classList.add('hidden');dashboard.classList.remove('hidden');groups.innerHTML=data.groups.map(g=>`<section class="group"><h2>${g.title}</h2>${g.links.map(l=>`<div class="link">${l.url?`<a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.name} →</a>`:`<strong>${l.name}</strong>`}${l.sensitive?'<span class="sensitive">Confidentiel</span>':''}${l.status?`<span class="status">${l.status}</span>`:''}</div>`).join('')}</section>`).join('')};
loginForm.addEventListener('submit',async e=>{e.preventDefault();loginStatus.textContent='Connexion…';loginStatus.className='';const body=Object.fromEntries(new FormData(loginForm));const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok){loginStatus.textContent=data.error||'Connexion impossible.';loginStatus.className='error';return}loginForm.reset();await render()});
logout.addEventListener('click',async()=>{await fetch('/api/logout',{method:'POST'});location.reload()});

async function loadSocial(){
  const el=document.getElementById('social-content');
  try{
    const r=await fetch('/api/pilotage-social/reseaux',{credentials:'same-origin'});
    const d=await r.json();
    let html='';
    if(!d.sheetsConfigure){html+='<div class="note">Google Sheets (Content Engine) non configuré — les statuts de connexion par projet ne peuvent pas encore être lus. Le reste (comptes Google, indexation, réseaux sociaux) est affiché ci-dessous.</div>'}
    html+='<div class="cat-block"><h3>Comptes Google</h3><table class="data"><tr><th>Compte</th><th>Usage</th></tr>'+d.comptesGoogle.comptes.map(c=>`<tr><td>${esc(c.email)}</td><td>${esc(c.usage)}</td></tr>`).join('')+'</table></div>';
    html+=`<div class="cat-block"><h3>Indexation Google (Search Console)</h3><p class="muted">${esc(d.indexationGoogle.note)}</p><table class="data"><tr><th>Date</th><th>Alerte</th></tr>`+d.indexationGoogle.alertesRecentes.map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.sujet)}</td></tr>`).join('')+'</table></div>';
    if(d.projets.length){html+='<div class="cat-block"><h3>Connexions par projet</h3><table class="data"><tr><th>Projet</th><th>LinkedIn</th><th>Facebook</th><th>Instagram</th><th>TikTok</th><th>YouTube</th></tr>'+d.projets.map(p=>`<tr><td>${esc(p.name)}</td>`+p.connexions.map(c=>`<td>${c.connecte?'✅':'—'}</td>`).join('')+'</tr>').join('')+'</table></div>'}
    html+=`<div class="note">${esc(d.reseauxSociauxOAuth.note)}</div>`;
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div class="note">Erreur de chargement.</div>'}
}

function prioBadge(p){
  if(!p)return'';
  const cls=p.startsWith('urgent')?'prio-urgent':(p.startsWith('normal')?'prio-normal':'prio-autre');
  return `<span class="prio ${cls}">${esc(p)}</span>`;
}
function renderSuivi(s){
  let h='<div class="suivi-wrap"><p class="muted" style="font-size:12px">📋 Suivi détaillé — instantané du '+esc(s.capturedAt)+'</p>';
  if(s.stats&&s.stats.length){h+='<div class="suivi-stats">'+s.stats.map(x=>`<div><b>${esc(x.v)}</b><span>${esc(x.l)}</span></div>`).join('')+'</div>'}
  if(s.decision){h+=`<div class="suivi-decision"><span class="tag">${esc(s.decision.tag)}</span>${esc(s.decision.texte)}<span class="qui">${esc(s.decision.qui)}</span></div>`}
  if(s.flags&&s.flags.length){h+=s.flags.map(f=>`<div class="suivi-flag"><span class="tag">${esc(f.tag)}</span>${esc(f.texte)}</div>`).join('')}
  if(s.enCours&&s.enCours.length){h+=`<h4>En cours (${s.enCours.length})</h4><ul class="suivi-tasks">`+s.enCours.map(t=>`<li><span class="pill pill-warn">${esc(t.owner)}</span><span class="suivi-idtag">${esc(t.id)}</span>${esc(t.titre)}</li>`).join('')+'</ul>'}
  if(s.bloque&&s.bloque.length){h+=`<h4>Bloqué</h4>`+s.bloque.map(b=>`<div class="suivi-block"><h5><span class="pill pill-${esc(b.niveau)}">${esc(b.qui)}</span></h5><p>${esc(b.pourquoi)}</p>`+(b.taches&&b.taches.length?'<ul>'+b.taches.map(t=>`<li><span class="suivi-idtag">${esc(t.id)}</span>${esc(t.titre)}</li>`).join('')+'</ul>':'')+'</div>').join('')}
  if(s.livreAujourdhui&&s.livreAujourdhui.length){h+=`<h4>Livré</h4><div class="suivi-delivered">`+s.livreAujourdhui.map(r=>`<div class="row"><span class="time">${esc(r.heure)}</span><span><strong>${esc(r.titre)}</strong> — ${esc(r.detail)} <span class="muted">(${esc(r.commit)})</span></span></div>`).join('')+'</div>'}
  if(s.acces&&s.acces.length){h+=`<h4>Accès</h4><div class="suivi-access">`+s.acces.map(a=>`<div><span>${esc(a.k)}</span><span>${a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.v)}</a>`:esc(a.v)}</span></div>`).join('')+'</div>'}
  if(s.commentLancer&&s.commentLancer.length){h+=`<h4>Comment lancer</h4><ol class="suivi-steps">`+s.commentLancer.map(x=>`<li>${esc(x)}</li>`).join('')+'</ol>'}
  if(s.source){h+=`<p class="muted" style="font-size:11px;margin-top:10px">${esc(s.source)}</p>`}
  h+='</div>';
  return h;
}
function projetCard(p){
  const dl=[
    ['URL', p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.url)}</a>`:'<span class="muted">—</span>'],
    ['GitHub', p.github?esc(p.github):'<span class="muted">—</span>'],
    ['Drive', p.drive?esc(p.drive):'<span class="muted">—</span>'],
    ['Local', p.local?esc(p.local):'<span class="muted">—</span>'],
    ['Dernier pilotage', p.dernierPilotage?esc(p.dernierPilotage):'<span class="muted">—</span>'],
  ];
  if(p.etat) dl.push(['État', esc(p.etat)]);
  let body='<dl>'+dl.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')+'</dl>';
  if(p.taches&&p.taches.length){body+='<div><strong>Tâches en cours / à réaliser</strong><ul>'+p.taches.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul></div>'}
  if(p.note){body+=`<p class="muted" style="margin-top:10px">↳ ${esc(p.note)}</p>`}
  if(p.suivi){body+=renderSuivi(p.suivi)}
  else{body+='<p class="muted" style="margin-top:10px;font-size:12px">Pas encore de fiche "Suivi" détaillée pour ce projet — envoie-moi (ou fais générer par l’agent qui travaille dessus) un état du jour au même format que celui de Propecto et je l’intègre ici.</p>'}
  return `<details class="proj"><summary>${esc(p.name)}${prioBadge(p.priorite)}</summary><div class="body">${body}</div></details>`;
}
async function loadProjets(){
  const el=document.getElementById('projets-content');
  try{
    const r=await fetch('/api/registre-projets',{credentials:'same-origin'});
    const d=await r.json();
    let html=`<p class="muted">${d.total} projets recensés — dernière vérification ${esc(d.updatedAt)}. Clique sur un projet pour dérouler ses infos, son état et ses tâches.</p>`;
    if(d.urgents&&d.urgents.length){html+='<div class="note"><strong>Priorités du moment : </strong>'+d.urgents.map(u=>esc(u.name)).join(', ')+'</div>'}
    html+=d.parCategorie.map(c=>`<div class="cat-block"><h3>${esc(c.categorie)} (${c.projets.length})</h3>`+c.projets.map(projetCard).join('')+'</div>').join('');
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div class="note">Erreur de chargement.</div>'}
}

async function loadFinance(){
  const el=document.getElementById('finance-content');
  try{
    const r=await fetch('/api/finance',{credentials:'same-origin'});
    const d=await r.json();
    let html=`<div class="note">${esc(d.avertissement)}</div>`;
    html+=`<div class="kpi-cards"><div class="kpi-card"><b>${d.totalRetenu.toFixed(2)} €</b><span>Total retenu (dépenses confirmées)</span></div></div>`;
    html+='<div class="cat-block"><h3>Dépenses (source : notifications Qonto)</h3><table class="data"><tr><th>Date</th><th>Fournisseur</th><th>Montant</th><th>Note</th></tr>'+
      d.depenses.map(dep=>`<tr><td>${esc(dep.date)}</td><td>${esc(dep.fournisseur)}</td><td class="num">${dep.annulee?'<s>':''}${dep.montant.toFixed(2)} ${esc(dep.devise)}${dep.annulee?'</s>':''}</td><td class="muted">${esc(dep.note||'')}</td></tr>`).join('')+'</table></div>';
    if(d.stripe){html+=`<div class="cat-block"><h3>Revenus — Stripe</h3><p class="muted">${esc(d.stripe.note)}</p></div>`}
    html+='<div class="cat-block"><h3>À relier / à dépouiller</h3><table class="data"><tr><th>Sujet</th><th>Détail</th></tr>'+
      d.aRelier.map(a=>`<tr><td>${esc(a.sujet)}</td><td>${esc(a.detail)}</td></tr>`).join('')+'</table></div>';
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div class="note">Erreur de chargement.</div>'}
}

async function loadKpi(){
  const el=document.getElementById('kpi-content');
  try{
    const r=await fetch('/api/kpi',{credentials:'same-origin'});
    const d=await r.json();
    const p=d.portefeuille;
    let html='<div class="kpi-cards">'+
      `<div class="kpi-card"><b>${p.total}</b><span>Projets recensés</span></div>`+
      `<div class="kpi-card"><b>${p.actifs}</b><span>Avec URL active</span></div>`+
      `<div class="kpi-card"><b>${p.avecGithub}</b><span>Avec dépôt GitHub identifié</span></div>`+
      `<div class="kpi-card"><b>${p.avecDrive}</b><span>Avec dossier Drive identifié</span></div>`+
      `<div class="kpi-card"><b>${p.aNettoyer+p.aIdentifier}</b><span>À nettoyer / à identifier</span></div>`+
      '</div>';
    if(p.urgents&&p.urgents.length){html+='<div class="note"><strong>Priorités du moment : </strong>'+p.urgents.map(u=>esc(u.name)).join(', ')+'</div>'}
    html+='<div class="cat-block"><h3>Répartition par catégorie</h3><table class="data"><tr><th>Catégorie</th><th>Projets</th></tr>'+
      Object.entries(p.parCategorie).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v}</td></tr>`).join('')+'</table></div>';
    const t=d.trafic;
    html+=`<div class="cat-block"><h3>Trafic (Vercel Web Analytics — instantané du ${esc(t.capturedAt)})</h3><table class="data"><tr><th>Projet</th><th>1j</th><th>7j</th><th>30j</th></tr>`+
      t.parProjet.map(pr=>{const per=pr.periodes;const cell=x=>x?`${x.visiteurs} vis. / ${x.pageviews} vues`:'<span class="muted">—</span>';return `<tr><td>${esc(pr.name)}</td><td>${cell(per['1j'])}</td><td>${cell(per['7j'])}</td><td>${cell(per['30j'])}</td></tr>`}).join('')+'</table></div>';
    const principal=t.parProjet[0];
    if(principal&&principal.pays30j){html+='<div class="cat-block"><h3>dyonysos.fr — visites par pays (30j)</h3><table class="data"><tr><th>Pays</th><th>Visiteurs</th><th>Pages vues</th></tr>'+principal.pays30j.map(c=>`<tr><td>${esc(c.pays)}</td><td class="num">${c.visiteurs}</td><td class="num">${c.pageviews}</td></tr>`).join('')+'</table></div>'}
    html+=`<div class="note">${esc(t.commentPasserEnLive)}</div>`;
    html+=`<div class="note">Indexation Google : ${esc(d.indexation.note)}</div>`;
    html+=`<div class="note">Domaine ${esc(d.domaine.nom)} (${esc(d.domaine.registrar)}) : ${esc(d.domaine.renouvellement)}</div>`;
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div class="note">Erreur de chargement.</div>'}
}

async function loadCrm(){
  const el=document.getElementById('crm-content');
  try{
    const r=await fetch('/api/crm',{credentials:'same-origin'});
    const d=await r.json();
    let html=`<p class="muted">Source : Odoo (base connectée à pet-stone.shop) — instantané du ${esc(d.capturedAt)}.</p>`;
    html+=`<div class="note">${esc(d.constat)}</div>`;
    const t=d.totaux;
    html+='<div class="kpi-cards">'+
      `<div class="kpi-card"><b>${t.leadsBruts}</b><span>Leads bruts (captures email)</span></div>`+
      `<div class="kpi-card"><b>${t.opportunites}</b><span>Opportunités (type CRM)</span></div>`+
      `<div class="kpi-card"><b>${t.perdues}</b><span>Marquées "Perdu"</span></div>`+
      `<div class="kpi-card"><b>${t.partenaires.toLocaleString('fr-FR')}</b><span>Fiches partenaires (base entière)</span></div>`+
      `<div class="kpi-card"><b>${t.partenairesDyonysos}</b><span>Contacts @dyonysos.be identifiés</span></div>`+
      '</div>';
    html+='<div class="cat-block"><h3>Étapes du pipeline Odoo</h3><table class="data"><tr><th>#</th><th>Étape</th></tr>'+
      d.stages.map(s=>`<tr><td class="num">${s.id}</td><td>${esc(s.name)}</td></tr>`).join('')+'</table></div>';
    html+='<div class="cat-block"><h3>Les 5 opportunités marquées "Perdu"</h3><table class="data"><tr><th>Titre</th><th>Contact</th></tr>'+
      d.perdues.map(p=>`<tr><td>${esc(p.titre)}</td><td class="muted">${p.contact?esc(p.contact):'—'}</td></tr>`).join('')+'</table></div>';
    html+='<div class="cat-block"><h3>Contacts @dyonysos.be identifiés dans Odoo</h3><table class="data"><tr><th>Adresse</th><th>Rôle</th></tr>'+
      d.contactsDyonysos.map(c=>`<tr><td>${esc(c.nom)}</td><td class="muted">${esc(c.role)}</td></tr>`).join('')+'</table></div>';
    html+=`<div class="cat-block"><h3>CRM par projet, piloté par email</h3><p class="muted">${esc(d.emailsScope.demande)}</p><p class="muted"><strong>État :</strong> ${esc(d.emailsScope.etat)}</p></div>`;
    html+=`<div class="note">${esc(d.commentPasserEnLive)}</div>`;
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div class="note">Erreur de chargement.</div>'}
}

async function loadStrategie(){
  const el=document.getElementById('strategie-content');
  try{
    const r=await fetch('/api/strategie',{credentials:'same-origin'});
    const d=await r.json();
    const p=d.portefeuille;
    let html='<div class="kpi-cards">'+
      `<div class="kpi-card"><b>${p.projetsActifs}</b><span>Projets actifs (avec URL)</span></div>`+
      `<div class="kpi-card"><b>${p.urgents.length}</b><span>Urgents</span></div>`+
      `<div class="kpi-card"><b>${p.meilleurTrafic30j?p.meilleurTrafic30j.v:'—'}</b><span>Meilleur trafic 30j${p.meilleurTrafic30j?' ('+esc(p.meilleurTrafic30j.name)+')':''}</span></div>`+
      `<div class="kpi-card"><b>${p.projetsAZeroVisiteur.length}</b><span>Projets à 0 visiteur mesuré</span></div>`+
      '</div>';
    if(p.urgents.length){html+='<div class="note"><strong>Urgents : </strong>'+p.urgents.map(esc).join(', ')+'</div>'}
    html+='<div class="cat-block"><h3>Projets prioritaires</h3><table class="data"><tr><th>Projet</th><th>Priorité</th><th>Trafic 30j</th><th>Piste d\'optimisation</th></tr>'+
      d.projetsPrioritaires.map(pp=>`<tr><td>${esc(pp.name)}</td><td>${esc(pp.priorite)}</td><td class="num">${pp.trafic30j==null?'—':pp.trafic30j}</td><td class="muted">${esc(pp.pisteOptimisation||'—')}</td></tr>`).join('')+'</table></div>';
    html+='<div class="cat-block"><h3>Concurrents / benchmarks</h3><table class="data"><tr><th>Projet</th><th>Concurrents identifiés</th><th>État</th></tr>'+
      d.benchmarks.map(b=>`<tr><td>${esc(b.projet)}</td><td class="muted">${esc(b.concurrentsIdentifies)}</td><td>${esc(b.etat)}</td></tr>`).join('')+'</table></div>';
    const v=d.veille;
    html+=`<div class="cat-block"><h3>Veille &amp; tendances par projet</h3><div class="note">${esc(v.constat)}</div>`+
      '<table class="data"><tr><th>Projet</th><th>Mots-clés de veille</th><th>Domaines connexes</th></tr>'+
      v.parProjet.map(pv=>`<tr><td>${esc(pv.projet)}</td><td class="muted">${pv.motsCles.map(esc).join(', ')}</td><td class="muted">${pv.domainesConnexes.map(esc).join(', ')}</td></tr>`).join('')+'</table></div>';
    html+='<div class="cat-block"><h3>Domaines connexes — niveau portefeuille</h3><table class="data"><tr><th>Cluster</th><th>Connexe à</th><th>Raison</th></tr>'+
      v.domainesConnexesPortefeuille.map(c=>`<tr><td>${esc(c.cluster)}</td><td class="muted">${esc(c.connexeA)}</td><td class="muted">${esc(c.raison)}</td></tr>`).join('')+'</table></div>';
    html+=`<div class="note">${esc(v.commentBrancherVeille)}</div>`;
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div class="note">Erreur de chargement.</div>'}
}

const loaders={social:loadSocial,projets:loadProjets,finance:loadFinance,kpi:loadKpi,crm:loadCrm,strategie:loadStrategie};
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  const tab=btn.dataset.tab;
  document.getElementById('panel-'+tab).classList.add('active');
  if(loaders[tab] && !loaded[tab]){loaded[tab]=true;loaders[tab]()}
}));

render();
</script><script src="/common.js" defer></script></body></html>
